counts" aria-label="Accounts">'+icon('settings')+'</button></div>'+(state.showActivity?'<div class="wing" style="left:1170px;top:230px;width:235px;height:476px">'+activity()+'</div>':'')+(state.showOrders?'<div class="wing" style="left:25px;top:260px;width:222px;height:430px">'+orders()+'</div>':'')+'<div class="floating-hint" style="left:505px;top:770px">'+icon('pin')+'Panels follow Rowan’s terminal · '+button('Collapse','collapse','text-button')+'</div>'}

function organizer(){const width=direction==='b'?1180:direction==='c'?1120:1020,left=(1440-width)/2,top=direction==='c'?235:145;return '<div class="window" style="left:'+left+'px;top:'+top+'px;width:'+width+'px">'+titlebar(direction==='c'?'Spaces':'Arrange windows','grid',tag('This computer','accent'))+'<div class="workspace-toolbar"><div><h2>'+(direction==='c'?'Make room for the work.':'A place for every agent.')+'</h2><p>Arrange terminals and their panels together.</p></div><div class="mode-switch"><button class="active" data-action="scope-local">On this computer</button><button data-action="scope-remote">Inside a remote desktop</button></div></div><div style="padding:18px 23px 0;display:flex;align-items:center;gap:18px"><span class="eyebrow">Layout</span>'+presets()+'<span class="grow"></span>'+tag('Keep manual placements')+'</div><div class="workspace-map">'+monitor('Workspace 1 · Native desktop','Main display')+monitor('Workspace 2 · Review','Second display',['Iris','Maya','Rowan'])+'</div><div class="scope-strip" style="margin:0 23px 18px;border:1px solid var(--line);border-radius:7px">'+icon('cloud')+'Remote desktops<span class="grow"></span><span>Cloud EU · Desktop A</span>'+button('Arrange there','scope-remote','text-button')+'</div><div class="layout-bottom"><span class="tiny dim">'+icon('lock')+' 2 pinned windows stay where they are.</span><span class="grow"></span>'+button('Undo last arrangement','undo','secondary','undo')+button('Arrange 6 terminals','arrange','primary','grid')+'</div></div>'+(direction==='c'?'<div class="floating-hint" style="left:512px;top:164px">'+icon('layers')+'Workspace 1 <span class="muted">/</span> Workspace 2 <span class="muted">/</span> Cloud EU</div>':'')}

function chat(){if(direction==='a')return '<div class="window" style="left:800px;top:130px;width:490px">'+titlebar('Papercup','chat',tag('Connected','accent'))+chatContent()+'</div><div class="window" style="left:135px;top:225px;width:590px;height:420px;opacity:.82">'+terminalBody()+'</div><div class="readout"><b>Ask, then get straight back to work.</b><br>A floating conversation beside your terminal.</div>';if(direction==='b')return '<div class="window" style="left:245px;top:115px;width:960px">'+titlebar('Papercup','chat',tag('Native desktop','accent'))+'<div style="display:flex"><aside class="history"><div class="row"><h3 style="margin:0">Conversations</h3><span class="grow"></span>'+icon('plus')+'</div><div class="spacer"></div><button class="active" data-action="history">Today’s workspace<small>Which agents need me?</small></button><button data-action="history">Release review<small>Cloud EU · yesterday</small></button><button data-action="history">Account routing<small>Studio / Build</small></button><div class="divider"></div><div class="eyebrow">Pinned context</div><div style="margin-top:15px">'+tag('Native desktop')+'</div><div style="margin-top:8px">'+tag('3 environments')+'</div></aside><div style="flex:1;min-width:0">'+chatContent()+'</div><aside class="account-side" style="width:210px"><div class="eyebrow">In view</div><h3>Native desktop</h3><p>4 agents across this computer and two cloud environments.</p><div class="divider"></div>'+agents.slice(0,3).map(a=>'<button class="peer" style="width:100%;text-align:left" data-peer="'+a.id+'"><span class="avatar '+a.color+'">'+a.initial+'</span><span><strong>'+a.name+'</strong><small>'+a.status+'</small></span></button>').join('')+'</aside></div></div>';return '<div class="window" style="left:950px;top:80px;width:450px;border-radius:18px;height:719px">'+titlebar('Papercup','chat',tag('Docked','accent'))+chatContent()+'</div><div class="window" style="left:130px;top:165px;width:755px;height:590px">'+terminalBody()+'</div><div class="side-tools" style="left:895px;top:190px"><button class="active" data-surface="chat" aria-label="Papercup chat">'+icon('chat')+'</button><button data-surface="accounts" aria-label="Accounts">'+icon('accounts')+'</button><button data-surface="launcher" aria-label="Quick Access">'+icon('search')+'</button></div>'}
function accountRows(compact=false){return accounts.map(a=>'<div class="account-row"><div class="row"><span class="provider-logo">'+a.symbol+'</span><span class="grow"><span class="account-name">'+a.name+'</span><span class="account-sub" style="display:block">'+a.provider+' · '+(a.sessions?a.sessions+' sessions':a.status)+'</span></span>'+(state.defaultAccount===a.id?tag('★ Default','accent'):tag(a.id==='research'?'Limited':'Ready',a.id==='research'?'warn':''))+'</div><div class="meter-row"><span>Session used</span><span class="meter '+(a.used>85?'warn':'')+'"><i style="width:'+a.used+'%"></i></span><span>'+a.used+'%</span></div>'+(!compact?'<div class="meter-row"><span>Week used&nbsp;&nbsp;&nbsp;</span><span class="meter '+(a.weekly>85?'warn':'')+'"><i style="width:'+a.weekly+'%"></i></span><span>'+a.weekly+'%</span></div>':'')+'<div class="account-actions"><button class="account-action '+(state.defaultAccount===a.id?'enabled':'')+'" data-account-default="'+a.id+'">'+(state.defaultAccount===a.id?'★':'☆')+' Default</button><button class="account-action '+(state.forced.has(a.id)?'enabled':'')+'" data-account-force="'+a.id+'">Force</button><button class="account-action '+(state.excluded.has(a.id)?'enabled':'')+'" data-account-exclude="'+a.id+'">Exclude</button></div></div>').join('')}
function routing(){return '<div class="scope-strip">'+icon('monitor')+'This computer<span class="grow"></span><span>Session routing</span><div class="mode-switch">'+['auto','default'].map(m=>'<button class="'+(state.routing===m?'active':'')+'" data-routing="'+m+'">'+(m==='auto'?'Auto':'Default')+'</button>').join('')+'</div></div>'}
function accountsView(){const head='<div class="account-summary"><div><h2>Accounts</h2><p>Usage and routing, together.</p></div><div class="summary-stat"><strong>7</strong><small>active sessions</small></div></div>';if(direction==='a')return '<div class="window" style="left:925px;top:80px;width:440px">'+titlebar('Accounts','accounts')+head+routing()+accountRows(true)+'<div class="account-asof"><span>Updated just now · sample values</span><button data-action="account-settings">Manage accounts '+icon('up')+'</button></div></div><div class="window" style="left:170px;top:230px;width:680px;height:420px;opacity:.68">'+terminalBody()+'</div>';if(direction==='b')return '<div class="window" style="left:310px;top:100px;width:850px">'+titlebar('Accounts & routing','accounts',tag('This computer','accent'))+head+'<div style="display:flex"><div style="flex:1">'+routing()+accountRows()+'<div class="account-asof"><span>Provider usage · updated just now</span>'+button('Clear overrides','clear-overrides','text-button')+'</div></div><aside class="account-side"><div class="eyebrow">Routing now</div><h3>'+(state.routing==='auto'?'Auto selection':'Default account')+'</h3><p>'+(state.routing==='auto'?'Choose an available account for each session. Fail over when a provider limit is reached.':'Use the selected default account for new sessions.')+'</p><div class="divider"></div><div class="eyebrow">Scope</div><h3>This computer</h3><p>Remote account controls belong to the selected saved environment.</p><div class="divider"></div><p><b>Default</b> selects the fallback.<br><b>Force</b> restricts the eligible pool.<br><b>Exclude</b> removes an account.</p><div class="spacer"></div>'+button('Manage accounts','account-settings','secondary','settings')+'</aside></div></div>';return '<div class="floating-hint" style="left:1110px;top:68px">'+icon('accounts')+'Accounts <i class="dot"></i> Auto</div><div class="window" style="left:1000px;top:119px;width:400px">'+titlebar('Account drawer','accounts')+routing()+accountRows(true)+'<div class="account-asof"><span>Session overrides only</span>'+button('Clear','clear-overrides','text-button')+'</div></div><div class="window" style="left:100px;top:180px;width:830px;height:580px">'+terminalBody()+'</div>'}
function overview(){
  const cards=[['terminal','Terminal + native HUD','hero'],['launcher','Quick Access','mini'],['organizer','Arrange windows','mini'],['chat','Native Papercup chat','mini'],['accounts','Native accounts','mini']];
  return '<div style="position:absolute;left:36px;top:53px;font-size:13px;font-weight:600">'+direction.toUpperCase()+' / '+directions[direction].name+'<span style="font-weight:400;margin-left:12px;color:var(--dim)">'+directions[direction].tag+'</span></div><div class="overview-grid">'+cards.map(([s,title,cls])=>{
    const content=renderSurface(s),w=cls==='hero'?1368:676,h=cls==='hero'?330:190,scale=(h-20)/780;
    return '<div class="overview-card '+cls+'" role="button" tabindex="0" data-surface="'+s+'" aria-label="Open '+title+'"><span class="overview-card-label">'+title+'</span><div class="overview-inner" inert style="transform:scale('+scale+');left:'+((w-1440*scale)/2)+'px;top:'+(12-60*scale)+'px;pointer-events:none">'+content+'</div></div>';
  }).join('')+'</div>';
}
function renderSurface(s){return ({launcher,terminal,organizer,chat,accounts:accountsView})[s]()}
function detailDrawer(kind){return '<div class="window" style="left:730px;top:190px;width:540px;z-index:25">'+titlebar(kind==='fleet'?'Fleet peers':kind==='plan'?'Native desktop':'Architecture review',kind==='fleet'?'layers':kind==='plan'?'plan':'report')+(kind==='fleet'?peerRows():'<div class="peek"><div class="eyebrow">'+(kind==='plan'?'Plan · in progress':'Report · updated 12m ago')+'</div><h2>Native desktop</h2><p>Make agents, their context, and account controls accessible from a native desktop interface.</p><div class="divider"></div><p>Use saved psu connections for remote environments. Selecting an agent focuses the existing terminal. Layout changes include its attached panels.</p><div class="spacer"></div>'+button('Focus Rowan’s terminal','focus-agent','primary','up')+'</div>')+'<div class="window-foot"><span class="grow"></span>'+button('Close preview','close-detail','secondary')+'</div></div>'}
function render(){document.getElementById('directions').innerHTML=Object.entries(directions).map(([id,d])=>'<button class="direction '+(direction===id?'selected':'')+'" data-direction="'+id+'" aria-pressed="'+(direction===id)+'"><span class="direction-letter">'+id.toUpperCase()+'</span><span><strong>'+d.name+'</strong><small>'+d.tag+'</small></span></button>').join('');document.getElementById('surfaces').innerHTML=Object.entries(surfaces).map(([id,s])=>'<button class="'+(surface===id?'selected':'')+'" data-surface="'+id+'" aria-pressed="'+(surface===id)+'">'+icon(s.icon)+'&nbsp; '+s.name+'</button>').join('')+'<span class="review-note">Native interface study · '+(platform==='ubuntu'?'GNOME':platform==='mac'?'macOS':'Windows')+'</span>';const stage=document.getElementById('stage');stage.dataset.direction=direction;stage.dataset.platform=platform;stage.innerHTML=(surface==='overview'?'<div class="wallpaper"></div>'+overview():desktop()+renderSurface(surface))+(state.detail?detailDrawer(state.detail):'')+'<span class="snapshot-badge">'+direction.toUpperCase()+' / '+directions[direction].name+' · '+(surfaces[surface]?.name||'Overview')+'</span>';document.getElementById('caption').innerHTML='<strong>'+directions[direction].name+'.</strong> '+directions[direction].description+'<br>Remote environments use psu’s saved connections. Accounts preserve Default, Force, and Exclude.';document.getElementById('platform').value=platform;const url=new URL(location.href);url.searchParams.set('direction',direction);url.searchParams.set('surface',surface);url.searchParams.set('platform',platform);history.replaceState(null,'',url);fit()}
function fitOverview(){document.querySelectorAll('.overview-card').forEach(card=>{const inner=card.querySelector('.overview-inner');const children=[...inner.children].filter(child=>child.matches('.window,.wing,.side-tools,.floating-hint,.group-caption'));if(!children.length)return;const minX=Math.min(...children.map(c=>c.offsetLeft)),minY=Math.min(...children.map(c=>c.offsetTop));const maxX=Math.max(...children.map(c=>c.offsetLeft+c.offsetWidth)),maxY=Math.max(...children.map(c=>c.offsetTop+c.offsetHeight));const width=card.clientWidth-28,height=card.clientHeight-55,scale=Math.min(width/(maxX-minX),height/(maxY-minY));inner.style.transform='scale('+scale+')';inner.style.left=(14+(width-(maxX-minX)*scale)/2-minX*scale)+'px';inner.style.top=(40+(height-(maxY-minY)*scale)/2-minY*scale)+'px'})}
function fit(){const wrap=document.getElementById('stage-fit'),scale=document.body.classList.contains('capture')?1:wrap.clientWidth/1440;wrap.style.height=880*scale+'px';document.getElementById('stage').style.transform='scale('+scale+')';if(surface==='overview')fitOverview()}
let toastTimer;function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
document.addEventListener('click',event=>{const b=event.target.closest('button,[role="button"][data-surface]');if(!b)return;let repaint=true;if(b.dataset.direction){direction=b.dataset.direction;state.detail=false}else if(b.dataset.surface){surface=b.dataset.surface;state.detail=false}else if(b.dataset.filter)state.filter=b.dataset.filter;else if(b.dataset.agent){state.selected=b.dataset.agent;if(direction==='a'){const a=agents.find(a=>a.id===state.selected);toast('Preview: '+(a.local?'focus '+a.name+'’s terminal':'connect using '+a.profile+' and focus '+a.name+'’s terminal'))}}else if(b.dataset.peer){state.selected=b.dataset.peer;toast('Preview: focus '+agents.find(a=>a.id===state.selected).name+'’s terminal')}else if(b.dataset.layout){state.layout=b.dataset.layout}else if(b.dataset.routing){state.routing=b.dataset.routing;toast('Preview: '+state.routing+' routing selected')}else if(b.dataset.accountDefault){state.defaultAccount=state.defaultAccount===b.dataset.accountDefault?'':b.dataset.accountDefault}else if(b.dataset.accountForce){const id=b.dataset.accountForce;state.forced.has(id)?state.forced.delete(id):state.forced.add(id)}else if(b.dataset.accountExclude){const id=b.dataset.accountExclude;state.excluded.has(id)?state.excluded.delete(id):state.excluded.add(id)}else if(b.dataset.action){const action=b.dataset.action;if(action==='plan-detail')state.detail='plan';else if(action==='report-detail')state.detail='report';else if(action==='fleet-drawer')state.detail='fleet';else if(action==='close-detail')state.detail=false;else if(action==='toggle-orders')state.showOrders=!state.showOrders;else if(action==='toggle-activity')state.showActivity=!state.showActivity;else if(action==='collapse'){state.showOrders=false;state.showActivity=false}else if(action==='open-chat'){surface='chat';state.detail=false}else if(action==='clear-overrides'){state.forced.clear();state.excluded.clear();toast('Preview: Force / Exclude overrides cleared')}else if(action==='focus-agent'){const a=agents.find(a=>a.id===state.selected);toast('Preview: '+(a.local?'focus the existing '+a.name+' terminal':'reuse psu saved connection '+a.profile+'; focus '+a.name+'’s terminal'))}else if(action==='focus-iris')toast('Preview: focus Iris’s existing terminal on Workspace 2');else if(action==='arrange')toast('Preview: arrange terminals and attached panels; keep an Undo snapshot');else if(action==='undo')toast('Preview: restore the previous window arrangement');else if(action==='scope-remote')toast('Preview: select a desktop through the existing psu connection');else if(action==='scope-local')toast('Preview: arrange windows on this computer');else if(action==='account-settings')toast('Preview: open the existing account settings');else if(action==='voice')toast('Preview: start Papercup voice');else if(action==='attach')toast('Preview: choose a file');else toast('Preview: '+action.replaceAll('-',' '))}else repaint=false;if(repaint)render()});
document.addEventListener('input',e=>{if(e.target.id==='agent-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('agent-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.target.id!=='agent-search')return;const ids=[...document.querySelectorAll('#stage [data-agent]')].map(row=>row.dataset.agent);if(['ArrowDown','ArrowUp'].includes(e.key)&&ids.length){e.preventDefault();const at=ids.indexOf(state.selected);state.selected=ids[(Math.max(at,0)+(e.key==='ArrowDown'?1:-1)+ids.length)%ids.length];render();document.getElementById('agent-search')?.focus()}else if(e.key==='Enter'&&ids.length){e.preventDefault();const a=agents.find(a=>a.id===(ids.includes(state.selected)?state.selected:ids[0]));toast('Preview: '+(a.local?'focus '+a.name+'’s existing terminal':'reuse psu saved connection '+a.profile+' and focus '+a.name+'’s terminal'))}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const v=document.getElementById('chat-input').value.trim();if(v){state.chatMessages.push(v);render();toast('Preview message only · nothing was sent')}}});
document.getElementById('platform').addEventListener('change',e=>{platform=e.target.value;render()});document.getElementById('overview').addEventListener('click',()=>{surface=surface==='overview'?'launcher':'overview';state.detail=false;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail){state.detail=false;render();return}if(e.target.matches('[role="button"][data-surface]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click();return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['1','2','3'].includes(e.key)){direction=['a','b','c'][+e.key-1];state.detail=false;render()}});
window.addEventListener('resize',fit);window.__mockup={set:(d,s,p='ubuntu')=>{direction=d;surface=s;platform=p;state.detail=false;render()},get:()=>({direction,surface,platform,...state,forced:[...state.forced],excluded:[...state.excluded]}),surfaces:Object.keys(surfaces),directions:Object.keys(directions)};render();
</script>
