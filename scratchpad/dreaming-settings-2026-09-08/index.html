function b(){return header()+'<div class="settings-title"><div class="pot-cell"><span class="avatar">P</span><div><h2>Papercusp</h2><p>Learning & dreaming settings</p></div></div><button class="btn soft" data-open="a">All pots</button></div><div class="settings-grid"><section class="setting-card"><div class="setting-card-top"><div class="setting-card-header"><span class="setting-icon">'+icon('learn')+'</span>'+switchGroup(true,'Learning for Papercusp')+'</div><h3>Learning</h3><p>Improve from the work happening in this pot.</p></div><div class="setting-options"><div class="option-row"><div><strong>Use saved learning settings</strong><small>Scout, review, and other learning lanes</small></div></div><button class="subtle-link" data-action="lanes">Manage learning lanes →</button></div><div class="card-foot"><span><span class="status-dot"></span>Learning enabled</span></div></section><section class="setting-card dream-card"><div class="setting-card-top"><div class="setting-card-header"><span class="setting-icon">'+icon('moon')+'</span>'+switchGroup(true,'Dreaming for Papercusp',true)+'</div><h3>Dreaming</h3><p>Combine what this pot knows into new ideas to review.</p></div><div class="setting-options"><div class="option-row"><div><strong>Run when idle</strong><small>Off means you start each run yourself.</small></div>'+switchButton(false,'Run when idle',true)+'</div><div class="option-row"><div><strong>Daily spending limit</strong><small>Used only by Dreaming</small></div><label class="money">$ <input aria-label="Dreaming daily spending limit" type="number" min="0" value="5"><span>/ day</span></label></div><div class="option-row"><div><strong>Manual run</strong><small>Ready when you are</small></div><button class="btn" data-action="run">'+icon('play')+'Dream now</button></div></div><div class="card-foot"><span>No run in progress</span><button class="subtle-link" data-action="history">View history →</button></div></section></div><div class="policy-note">'+icon('info')+'<span>Learning and Dreaming are independent. Turning Dreaming off prevents new runs; a call already underway may finish.</span></div><div class="footer-actions"><small>Example settings · changes in this mockup are local</small><button class="btn primary" data-action="save">Save settings</button></div>'}
function modeMenu(){return '<div class="mode-popover" role="menu" aria-label="Dreaming mode">'+[['Off','No Dreaming runs','off'],['Manual only','Run only when you choose Dream now','play'],['When idle','Explore automatically within the budget','moon']].map(([name,desc,ico])=>'<button class="mode-option '+(name==='Off'?'chosen':'')+'" role="menuitemradio" aria-checked="'+(name==='Off')+'" data-mode="'+name+'">'+icon(ico)+'<span><strong>'+name+'</strong><small>'+desc+'</small></span>'+(name==='Off'?'<span class="check">'+icon('check')+'</span>':'')+'</button>').join('')+'</div>'}
function c(){return header()+'<div class="section-head"><div><h2>Learning & dreaming by pot</h2><p>A separate control for learning, and a clear mode for Dreaming.</p></div>'+search()+'</div><div class="pot-table modes-table" style="overflow:visible"><div class="table-head" style="border-radius:11px 11px 0 0"><span>Pot</span><span>Learning</span><span class="coltitle">'+icon('moon')+'Dreaming</span><span></span></div>'+pots.map((p,i)=>'<div class="pot-row" data-pot="'+p.name.toLowerCase()+'">'+potCell(p)+switchGroup(p.learning,'Learning for '+p.name)+'<div class="mode-wrap"><button class="mode-btn '+(i===0?'active':'')+'" aria-label="Dreaming mode for '+p.name+'" aria-expanded="'+(i===0)+'" data-menu="'+i+'"><span>'+p.mode+'</span>'+icon('down')+'</button>'+(i===0?modeMenu():'')+'</div><button class="icon-button" aria-label="Settings for '+p.name+'" data-open="b">'+icon('chevron')+'</button></div>').join('')+'</div><div class="mode-explainer"><strong>A state you can understand at a glance.</strong><br>Off stops Dreaming. Manual only waits for your start. When idle allows automatic runs within that pot’s budget.</div><p class="inline-note">Budget and run history stay in the pot’s settings. Changing a Dreaming mode never changes Learning.</p>'+foot()}
let concept=new URLSearchParams(location.search).get('concept')||'a';if(!meta[concept])concept='a';
function show(next){concept=next;document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-selected',b.dataset.concept===next));document.querySelector('#app').innerHTML=({a,b,c})[next]();document.querySelector('#concept-number').textContent=next.toUpperCase();document.querySelector('#concept-title').innerHTML=meta[next].title+(meta[next].recommended?'<span class="recommended">Recommended</span>':'');document.querySelector('#concept-description').textContent=meta[next].description;history.replaceState({},'',location.pathname+'?concept='+next);bind()}
let toastTimer;function toast(text){const t=document.querySelector('.toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4000)}
function bind(){document.querySelectorAll('[role=switch]').forEach(b=>b.onclick=()=>{const next=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(next));const label=b.parentElement.querySelector('.switch-label');if(label){label.textContent=next?'On':'Off';label.classList.toggle('on',next)}if(b.getAttribute('aria-label')==='Dreaming for Papercusp'&&concept==='b')document.querySelector('[data-action=run]').disabled=!next;toast(b.getAttribute('aria-label')+': '+(next?'on':'off')+' · mockup only')});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>toast(({pause:'All activity would pause without changing saved settings.',done:'Concept viewed. Your workspace settings are unchanged.',save:'Settings preview saved locally for this view.',run:'A manual Dreaming run would start. No real run was started.',history:'Run history would open here.',lanes:'Existing learning lane controls would open here.'})[b.dataset.action]));const search=document.querySelector('input[aria-label="Find a pot"]');if(search)search.oninput=()=>document.querySelectorAll('[data-pot]').forEach(r=>r.hidden=!r.dataset.pot.includes(search.value.toLowerCase()));document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode-popover').forEach(p=>p.remove());b.insertAdjacentHTML('afterend',modeMenu());b.setAttribute('aria-expanded','true');bindModes()});bindModes()}
function bindModes(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const wrap=b.closest('.mode-wrap');wrap.querySelector('.mode-btn span').textContent=b.dataset.mode;wrap.querySelector('.mode-btn').setAttribute('aria-expanded','false');wrap.querySelector('.mode-popover').remove();toast('Dreaming: '+b.dataset.mode+' · Learning is unchanged')})}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>show(b.dataset.concept));show(concept);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.mode-popover').forEach(p=>p.remove());document.querySelector('.toast').hidden=true}});
</script>
</body>
</html>
