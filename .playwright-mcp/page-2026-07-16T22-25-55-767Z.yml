              - group [ref=f6e2761]:
                - paragraph [ref=f6e2763]: "Scope: superproject (CWD /tmp/extbench-hsaeV8), branch lineage v2. What I found: - HEAD=25972de0 is already a merge commit (parents ea45ef61 [local] + bfc8612b [origin/v2]) but it was committed WITHOUT resolving conflicts: 126 tracked files contain literal git conflict markers (<<<<<<< HEAD / ======= / >>>>>>> origin/v2). Index has 0 unmerged paths, so it was force `git add`ed + committed. This is a \"committed bad merge.\" - The divergence is pathological: local HEAD is 224 commits ahead of merge-base 3664b736 and 983 behind origin/v2 — both lineages changed overlapping files across the whole repo (every workflow, go.mod/go.sum, all *.pb.go, package-lock.json, ~200 UI/source files). - The shared working tree has >=4 other concurrent `claude` agents with cwd=/tmp/extbench-hsaeV8; HEAD moved under me (ea45ef61 -> 25972de0) and a 208-unmerged state appeared/cleared without my action. Why I am not proceeding: - I cannot acquire the exclusive `git-sync` lock: the locks:* / coord:* platform tools are NOT exposed in this session and there is no ToolSearch to load them. Per the merge-resolver rules, \"if you can't get the lock / another resolver-tick is active — stop.\" Racing the concurrent agents on a shared tree risks a corrupt half-merged state. - Even absent the race, this is not a safe mechanical merge: faithfully integrating 983-vs-224 commits of divergence across ~200 files (incl. generated protobuf/lock/sum files that must be regenerated with buf/go/npm toolchains, not hand-edited) cannot be done by hand without guessing. A guessed resolution would be another bad merge. What a human/operator needs to decide: 1. Quiesce the concurrent resolvers/git-sync ticks on this harness and let ONE resolver redo the merge from ea45ef61 (parents preserved) with toolchain regeneration of generated files; and/or 2. Investigate the buggy concurrent resolver that committed conflict markers (a resolver should never `git add` unresolved markers); and/or 3. Restore the lock/coord tooling for merge-resolver sessions so mutual exclusion actually holds. I left the tree untouched (no competing writes, no reset of the peer's commit, no push). My own working tree has no in-progress merge."
