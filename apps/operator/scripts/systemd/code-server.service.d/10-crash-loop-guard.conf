# WI-10002865: the base unit can outlive both its executable and the directory
# used by its append-only log target. The first case exits 203/EXEC; the second
# exits 209/STDOUT before ExecStart. With Restart=always, either becomes a
# permanent five-second crash loop. Skip activation while the executable is
# absent, use the journal (the host's bounded service-log authority), and keep a
# clean code-server exit down; only failures need recovery.
[Unit]
ConditionFileIsExecutable=%h/.local/bin/code-server

[Service]
StandardOutput=journal
StandardError=journal
Restart=on-failure
