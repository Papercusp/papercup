# P-004 memory-public-release-hardening-2026-07-11 (su-efc53): bounded embed
# concurrency.
#
# ⚠ The original sizing rationale — "2 slots x intraOp 4 threads = exactly the
# 800% CPUQuota" — was THEORETICAL, and measurement FALSIFIED it
# (EI-21124316756593208, 2026-08-24). ORT's intraOpNumThreads=4 does NOT buy 4
# cores on these models: a 20s two-sample /proc/<pid>/stat delta taken with BOTH
# slots busy measured 2.02 cores total = 1.01 cores per in-flight inference. So
# c=2 drew ~200% of an 800% quota while its service station sat 100% occupied —
# the sidecar was SLOT-limited, not CPU-limited, and fleet-wide semantic
# retrieval was being dropped as a result.
#
# Measured at c=2 (2026-08-24): enqueue throughput 1.33/s (cacheMisses++ fires
# exactly once per enqueued ONNX unit, so misses/s IS worker throughput), with
# occupancy pinned at 2/2 on every observation. Little's Law then gives service
# time S = L/X = 2/1.33 ~= 1.50s. Offered load a = lambda*S = 2.0 erlangs against
# c=2 => rho = 1.00 — exactly saturated. The queue was stabilised ONLY by callers
# aborting at their 1200ms/4000ms budgets and shedding their own load, which is
# why /healthz looked perfectly healthy throughout. Novel-embed latency over 10
# same-shape probes: min 2.09s, median ~11.4s, max 67.8s — ~87% of it queue wait.
#
# c=6 => rho = a/c = 0.33, predicted queue wait ~0.08s, total ~1.6s; CPU
# 6 x 1.01 ~= 610% of the 800% quota, leaving headroom.
#
# ⚠ Do NOT raise past 6 without ALSO raising CPUQuota: c=8 projects to ~810%,
# over quota, where ORT threads get throttled and S RISES instead of falling.
#
# VERIFIED AFTER THE CHANGE (13:38Z, same 10-probe shape as the baseline):
# median 11.4s -> 1.78s, max 67.8s -> 7.97s, occupancy no longer pinned (1/6 at
# rest vs 2/2 always). Steady-state load lambda=1.93/s at 1.93 cores = ~1.0
# core-second per inference, i.e. rho ~= 0.32 against c=6 — as predicted.
#
# With c=6 the occupancy gauge can finally VARY, and latency tracks it
# monotonically — the direct confirmation the c=2 probe could never produce:
#   1 in flight -> 0.26s, 1.00s | 2 -> 0.49s, 0.85s | 3 -> 3.44s
#   6 in flight -> 2.56s, 3.29s, 7.97s
#
# ⚠ CORRECTION to an earlier reading in this file's history: the Little's-Law
# estimate S >= 1.5s was taken under SATURATION and is NOT the solo service time.
# Measured directly at low occupancy, a novel query embed completes in
# 0.26-1.00s — INSIDE the 1200ms budget (libs/generic/search/src/hybrid.ts:313).
# A solo inference gets all intraOpNumThreads=4; concurrent ones contend down to
# ~1 core each, which is why S appeared ~1.5s when both slots were always busy.
# So c=6 does NOT leave the corpus-recall path hopeless — it moves it from
# ~always-failing to succeeding at rest and still missing during bursts (6 in
# flight => 2.5-8s). The 4000ms prose path (PROSE_RERANK_TIMEOUT_MS) is
# comfortably rescued. Remaining work is burst absorption, not steady-state.
#
# ⚠ Do NOT reach for cacheMax: hit rate measured 56% at cache size 271 and the
# SAME 56% at size 1024, so hits are dominated by short-reuse-distance and
# in-flight coalescing, not by capacity. Growing the LRU buys ~nothing.
[Service]
Environment=PAPERCUSP_EMBED_SIDECAR_CONCURRENCY=6
