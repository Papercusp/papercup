# host-memory-reduction-2026-09-27 P-005 (WI-10003419): jemalloc instead of glibc malloc.
#
# The sidecar's resident memory was glibc retention, not live data. Under glibc (pid 222384,
# 2026-09-27 06:59Z) malloc_stats reported 4222 MB taken from the OS with 1187 MB in use; a
# one-off malloc_trim(0) dropped RssAnon 4424 -> 1543 MiB and the process stayed healthy.
# MALLOC_ARENA_MAX=2 (below) does not help: most of it was the brk main arena (3.0 GB), and
# MALLOC_TRIM_THRESHOLD_ only trims the heap top.
#
# jemalloc returns freed pages on a decay timer instead. Measured A/B on the live sidecar
# (pid 376321, from 06:58Z, full fleet traffic): a 3.8 GB first-inference peak decayed within
# ~5 min to 1.32-1.37 GB RssAnon, flat through 07:14Z (.papercusp/scratch/
# embed-sidecar-anon-series.tsv). Embeddings verified OK on both CUDA models (gemma 768-d,
# harrier 1024-d). Net: ~3.2 GB less resident, no code change.
#
# The sidecar is a leaf process (worker_threads, no child processes), so LD_PRELOAD does not
# leak into anything else. background_thread runs the decay without an allocating caller;
# narenas:4 matches the few threads that allocate here.
#
# Needs the libjemalloc2 package (Ubuntu: apt install libjemalloc2). If the library is
# missing, ld.so logs "cannot be preloaded: ignored" and the sidecar runs on glibc as before.
[Service]
Environment=LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
Environment=MALLOC_CONF=background_thread:true,narenas:4
