# WI-10003355 [owner #664 2026-09-26 "operator very laggy"]: the MCP proxy
# (:9071) sits in front of every agent tool call, so a swapped-out proxy adds
# disk-read latency to all of them. It needs ~100 MB of RAM but had 310 MB
# pushed to swap under host-wide pressure. Same policy as papercup-dev-api
# (55-memory-envelope.conf).
[Service]
MemoryAccounting=yes
MemorySwapMax=0
