# D-137 / P-046: the staging operator (:3170) serves the workspace-host canary
# route during integration verification. Keep its trust store in a private,
# service-owned StateDirectory so the controller can resolve a deterministic
# profile instead of failing closed when KNOWN_HOSTS is unset.
#
# The resolver supplies deployment-driver defaults for the workspace SSH user
# and signed remote initializer. STATE_DIRECTORY is exported by systemd and
# becomes the absolute known_hosts parent; no credential or host-specific value
# is copied into the unit.
[Service]
StateDirectory=papercusp/controller
StateDirectoryMode=0700
# P-046 credential isolation: do not inherit the box-wide Vertex service-account
# ADC path. Host credentials must arrive through the typed resolver references.
UnsetEnvironment=GOOGLE_APPLICATION_CREDENTIALS
