# Build the :3170 plain-Node host from the isolated committed staging checkout.
# sync-staging-checkout.sh prebuilds this graph while the old generation still
# serves; ExecStartPre reuses it only when bundle-host-freshness.mjs proves the
# checkout HEAD, tracked cleanliness, entry and whole dist-host tree unchanged.
# Any drift falls back to bundle-host.sh's ordinary full rebuild.
[Service]
# Keep the unit activating until hono-host has bound the request listener and
# sent READY=1 from its actual listening callback.
Type=notify
NotifyAccess=all
Environment=PAPERCUSP_BUNDLE_REUSE_FRESH=1
# Share staging-sync's checkout lock for the entire bundle read. Its exclusive
# phase materializes submodules in place; bundling before that phase ends can
# read missing files and boot a stale fallback bundle.
ExecStartPre=/usr/bin/flock -s /tmp/papercup-staging-sync.lock %h/papercupai-workspace/papercusp-staging/apps/operator/bin/bundle-host.sh
ExecStart=
ExecStart=/usr/bin/bash -c 'set -a; [ -f .env.local ] && . ./.env.local; set +a; export PAPERCUSP_HONO_PORT=3170 PAPERCUSP_PTY_WS_PORT=3156 MOBILE_VOICE_WS_PORT=3168 PAPERCUSP_BIND_HOST=127.0.0.1; exec node dist-host/hono-host.mjs'
