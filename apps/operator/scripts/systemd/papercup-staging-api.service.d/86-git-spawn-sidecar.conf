# Request-host git spawn offload (WI-10002829 / P-007, 2026-09-26).
#
# MEASURED: a native plan-popup run on :3170 took 17,625ms. Its request sat 17s
# between "request-started" and "response-headers" while the host logged
# "[event-loop-lag] critically saturated". The captured loop-saturation profile
# (pid 692477, p95 961ms) put 2,522ms of 3,000ms in native `spawn` self time, with
# 2,323ms under gitPipelinePosition -> refContains -> realGit -> execFile('git').
# fork() cost scales with parent RSS (EI-18808838427010743) and this host was at
# 2.27GB, so every git call is charged as synchronous main-thread time.
#
# This request-only host (PAPERCUSP_BACKGROUND_WORKERS=0) never gets the broad
# PAPERCUSP_SPAWNER_SIDECAR switch; that belongs to the bg-host. Each git-heavy
# caller therefore opts in through its OWN explicit per-subsystem variable, the
# pattern WI-7160 established:
#   - PAPERCUSP_DEV_DEPLOY_SPAWN_SIDECAR    dev-deploy-state.ts `git()`
#   - PAPERCUSP_SYSTEM_HEALTH_SPAWN_SIDECAR system-health/compute.ts `runGit`
#   - PAPERCUSP_GIT_PIPELINE_SPAWN_SIDECAR  git-pipeline-position.ts `realGit`
#                                           (dev:pipeline_position, state cells,
#                                           deployment-position, release:trace)
#
# The sidecar spawns lazily on first use. Any sidecar fault falls back to a local
# spawn: slower, never incorrect. Guarded by
# apps/operator/scripts/__tests__/request-host-git-spawn-sidecar.test.ts, which
# fails when a new gitSidecarEnabled('<var>') caller appears without a
# request-host classification.
[Service]
Environment=PAPERCUSP_DEV_DEPLOY_SPAWN_SIDECAR=1
Environment=PAPERCUSP_SYSTEM_HEALTH_SPAWN_SIDECAR=1
Environment=PAPERCUSP_GIT_PIPELINE_SPAWN_SIDECAR=1
Environment=PAPERCUSP_PLAN_AUDIT_SPAWN_SIDECAR=1
