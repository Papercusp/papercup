# Isolated staging tier: :3170 serves the committed staging worktree that the
# papercup-staging-sync timer advances. Keep this and 95-bundled-entry.conf on
# the SAME root; sync-staging-checkout.sh refuses a split configuration.
# %h is systemd's user-home specifier, never a box-identity literal.
[Service]
WorkingDirectory=%h/papercupai-workspace/papercusp-staging/apps/operator
Environment=PAPERCUSP_INTEGRATION_ROOT=%h/papercupai-workspace/papercusp-staging
