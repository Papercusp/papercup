# host-memory-reduction-2026-09-27 P-005: cap glibc malloc arenas, as :3070 (same
# operator build, green lane) and the embed sidecar already do. Unset, glibc spawns
# up to 8 x ncpu arenas and fragments the native heap across them. Takes effect on
# the next staging restart. Reversible: remove the symlink in
# ~/.config/systemd/user/papercusp-staging-api.service.d/ and daemon-reload.
[Service]
Environment=MALLOC_ARENA_MAX=2
