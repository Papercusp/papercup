# papercup-staging-api.service.d/97-bundle-stale-start.conf
#
# EI-19457229906581679 (su-98f41fcf, 2026-08-27).
#
# ADDITIVE ONLY — this file deliberately declares no ExecStart and no
# ExecStartPre. The bundled entry is owned by the tracked sibling
# 95-bundled-entry.conf; keeping fallback/timeout policy here lets either setting
# roll back independently without obscuring the launch command.
#
# ── 1. PAPERCUSP_BUNDLE_ALLOW_STALE_START ────────────────────────────────────
# bundle-host.sh runs as this unit's ExecStartPre against the isolated committed
# staging checkout. On a failed bundle
# the script exits 1 by default. That default is correct for a RELEASE caller
# (deploy-cli must not report a green deploy on stale bytes — WI-41242) and
# wrong for a SUPERVISOR: a non-zero ExecStartPre means the unit does not start
# AT ALL, and Restart=always + RestartSec=5 then re-bundles the same broken tree
# every five seconds until a human intervenes.
#
# MEASURED 2026-08-27: a syntax error in the shared tree failed the bundle at
# 10:47:11Z with a known-good bundle sitting on disk and the stale marker
# written, and :3170 still died into its start-limit — down fleet-wide. That is
# the outage bundle-host.sh's own header forbids ("A BUNDLE FAILURE MUST NOT
# TAKE THE SERVICE DOWN", EI-20093985382484201).
#
# This variable declares that THIS caller is asking "may the unit start?", not
# "did the requested code build?". It boots the last-known-good bundle, loudly:
# the journal carries the FALLING BACK / STALE CODE banner and /api/health
# reports bundleStale. It does NOT license starting with no bundle at all —
# that branch still refuses, because exec'ing a missing entrypoint just
# crash-loops on MODULE_NOT_FOUND instead of failing with a diagnosis.
#
# ── 2. TimeoutStartSec ───────────────────────────────────────────────────────
# REQUIRED companion to a bundling ExecStartPre (plan
# substrate-observability-bug-wave-2026-08-26, D-003). The tracked bg-host twin
# carries that rule explicitly; this unit has run the same ExecStartPre since
# 2026-07-07 and has never set the timeout, so it inherits systemd's 90s default
# against a bundle measured at 36.61s warm on an UNLOADED box. This host has
# been observed at load 421 (128 cores), with a measured cadence knee near 230.
# Losing that race is not graceful: systemd SIGTERMs the start job and
# Restart=always retries the same losing boot. 300s (~8x the measured bundle)
# matches papercup-bg-host.service.d/95-bundled-entry.conf.
#
# Install:  ln -sfn <this file> ~/.config/systemd/user/papercusp-staging-api.service.d/
#           && systemctl --user daemon-reload
# Rollback: rm that symlink && systemctl --user daemon-reload
# Neither install nor rollback restarts the unit; both settings take effect at
# the next start. Do NOT restart :3170 to "apply" them — it runs
# KillMode=control-group and a restart while live takes its children with it.
[Service]
Environment=PAPERCUSP_BUNDLE_ALLOW_STALE_START=1
TimeoutStartSec=300
