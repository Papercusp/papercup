# WI-10003355 [owner #664 2026-09-26 "operator very laggy"]: keep the staging
# operator's request heap in RAM. Under host-wide memory pressure its workers
# held ~385 MB in swap; V8 GC over swapped pages stalls the event loop for
# seconds (measured on the :3070 sibling: stalls up to 4.5 s coinciding with
# 600+ major faults/s). Same policy as papercup-dev-api (55-memory-envelope.conf),
# postgresql@18-main and papercusp-bg-host.
[Service]
MemoryAccounting=yes
MemorySwapMax=0
