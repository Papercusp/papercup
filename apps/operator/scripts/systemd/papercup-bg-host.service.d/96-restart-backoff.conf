# papercup-bg-host restart amplifier bound (WI-42260 / EI-21552486793516674,
# plan substrate-observability-bug-wave-2026-08-26 D-001 + D-005 + D-006, su-b675d, 2026-08-27).
#
# WHAT THIS BOUNDS
# Before this file: Restart=always (40-restart-always.conf) + RestartSec=5 with RestartSteps=0,
# i.e. a FLAT 5s retry forever. A structural fault that can never boot therefore retries at the
# crash cycle indefinitely. Measured worst case, 2026-08-26: 51 failed boots in 756s
# (EI-21544862112303072, top-level await under CJS). Under the bundled entry each of those
# attempts also runs a full esbuild bundle in ExecStartPre (~21s of CPU, measured in production),
# so an unbounded storm is expensive on an already-contended box.
#
# THE NUMBERS, AND WHY THESE ONES (all measured, none assumed — see D-005)
#   RestartSec=5 is deliberately LEFT ALONE. Over a 5-day window, 7 of 10 failure bursts were a
#   SINGLE failure that recovered on retry 1. Retry 1 happens at RestartSec, before any backoff
#   engages, so the common case is completely unaffected by this file. Slowing retry 1 would
#   CAUSE the outage this work-item exists to prevent.
#   Progression (systemd interpolates geometrically from RestartSec to RestartMaxDelaySec over
#   RestartSteps): ~5, 8, 13, 22, 36, then pinned at 60.
#   Against the 756s storm above: ~16 attempts instead of 51.
#
# ⚠ DO NOT RAISE RestartMaxDelaySec "for better damping". MEASURED on systemd 255.4:
#   a SUCCESSFUL run does NOT reset the restart counter. A probe that failed 4x, then stayed
#   up 30s, then failed again waited the FULL ceiling (32s) on the next retry, with NRestarts
#   climbing 4 -> 5 and never resetting. So RestartMaxDelaySec is not merely a storm ceiling —
#   it is the STEADY-STATE auto-restart latency of the substrate primary once the counter passes
#   RestartSteps. 60s is chosen as the worst latency acceptable for git-sync / DBOS routines /
#   the Mug wake-loop. A 300s ceiling would turn an ordinary transient into a 5-minute outage.
#   (Only AUTO restarts increment it; an explicit `systemctl restart`/stop+start zeroes it, which
#   is why the live unit reads NRestarts=0 after a managed restart.)
#
# ⚠ StartLimit IS DELIBERATELY NOT SET HERE, and must not be "fixed" to fire.
#   The inherited default (StartLimitIntervalSec=10s / StartLimitBurst=5) cannot fire, because
#   5 starts in 10s is arithmetically impossible against a >=12s crash cycle. That is FINE and
#   is the intended state. MEASURED: a unit that trips its start limit goes to `failed` and
#   STAYS there — it does not self-clear when the interval passes (probe held `failed` well past
#   a full interval); systemd's own Restart= logic never resumes, only an external start does.
#   bghost-watchdog.mjs recovers a wedged host with a bare `systemctl --user restart` and no
#   `reset-failed` (bghost-watchdog.mjs:1341), so a tripped limit would park the substrate
#   primary in `failed` behind a recovery path that only works if the watchdog is alive.
#   Backoff is preferred precisely because it NEVER gives up: it damps a storm while keeping the
#   host self-healing with no external dependency.
#
# Reversible: rm the symlink in ~/.config/systemd/user/papercup-bg-host.service.d/ +
# `systemctl --user daemon-reload`. Activation rides the next restart; do NOT restart bg-host
# by hand to apply it.

[Service]
RestartSteps=5
RestartMaxDelaySec=60
