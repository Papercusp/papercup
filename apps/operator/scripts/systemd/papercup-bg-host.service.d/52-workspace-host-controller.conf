# D-137 / P-046: the dedicated bg-host (:3271) is also a workspace-host
# initialization controller. Keep its trust store in a private, service-owned
# StateDirectory so the production canary route can resolve a deterministic
# controller profile instead of failing closed on an unset environment.
#
# The resolver supplies the deployment-driver defaults for the workspace SSH
# user and signed remote initializer. STATE_DIRECTORY is exported by systemd
# and becomes the absolute known_hosts parent; no credential or host-specific
# value is copied into the unit.
[Service]
StateDirectory=papercusp/controller
StateDirectoryMode=0700
# P-046 credential isolation: keep the box-wide Vertex service-account ADC path
# out of the DBOS host. Provider auth must use the typed connection resolver.
UnsetEnvironment=GOOGLE_APPLICATION_CREDENTIALS
