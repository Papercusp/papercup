# papercup-bg-host.service.d/95-bundled-entry.conf
#
# Build the plain-Node host bundle immediately before every bg-host start. The
# base unit's npx/tsx entry reads the shared checkout directly, so a lazy import
# can cache a half-written module after a multi-file edit and keep the broken
# behavior alive until the next restart.
#
# ExecStart is a list-valued systemd setting: the empty assignment below clears
# the base command before installing the bundled entry. The replacement repeats
# the base unit's inline environment because those assignments lived inside its
# bash command rather than in Environment= directives. A bare `node` command
# would otherwise silently lose the port, DBOS, and routine-engine settings.
[Service]
ExecStartPre=/home/marsh-office/papercupai-workspace/papercusp/apps/operator/bin/bundle-host.sh
ExecStart=
ExecStart=/usr/bin/bash -c "set -a; [ -f .env.local ] && . ./.env.local; set +a; exec env \
  PAPERCUSP_HONO_PORT=3271 \
  PAPERCUSP_BIND_HOST=127.0.0.1 \
  PAPERCUSP_BACKGROUND_WORKERS=1 \
  PAPERCUSP_DBOS_ENABLE=1 \
  PAPERCUSP_DBOS_ORCHESTRATOR=1 \
  PAPERCUSP_DBOS_ROUTINES=1 \
  PAPERCUSP_DBOS_TIMERS=1 \
  PAPERCUSP_DBOS_AUTOLOOP=0 \
  PAPERCUSP_DB_POOL_MAX=24 \
  DB_IDLE_TIMEOUT=10 \
  PAPERCUSP_EXPECTED_OPERATOR_PROCS=6 \
  DBOS__VMID=bg-host-3270 \
  DBOS__APPVERSION=bg-host-v1 \
  node dist-host/hono-host.mjs"
