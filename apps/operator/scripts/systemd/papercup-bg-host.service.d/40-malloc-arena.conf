# host-memory-reduction-2026-09-27 P-005: cap glibc malloc arenas, as :3070 and the
# embed sidecar already do. Unset, glibc spawns up to 8 x ncpu arenas. Measured
# 2026-09-27 on bg-host pid 3145698 at 156 s: 18 arena heaps (205 MiB) + 191 MiB brk,
# so the native side is ~10% of RSS. The V8 side (~88%) is the coord messages cache,
# handled in code, not here. Takes effect on the next bg-host restart.
# Reversible: remove the symlink in ~/.config/systemd/user/papercusp-bg-host.service.d/
# and daemon-reload.
[Service]
Environment=MALLOC_ARENA_MAX=2
