# papercup-bg-host.service.d/97-gateway-systemd-authority.conf
#
# Linux has a dedicated, Restart=always inference-gateway unit. Keep that unit
# the single :8788 authority by disabling the bg-host's cross-platform fallback
# supervisor in this systemd-managed process.
#
# Without this pin, boot order decides ownership: if bg-host starts while
# papercup-inference-gateway.service is absent, ensureGatewaySidecar() correctly
# spawns a managed child. When systemd later recovers its dedicated unit, that
# unit crash-loops on EADDRINUSE while the gateway itself keeps serving from the
# bg-host cgroup. The health surface then reports the failed duplicate as a
# critical outage and the unit reconciler repeatedly restarts it. This exact
# split authority was reproduced under EI-22359055031706978.
#
# This drop-in is Linux/systemd-only. Packaged macOS/Windows hosts do not load
# it, so their bg-host retains the default-on managed gateway fallback.
[Service]
Environment=PAPERCUSP_GATEWAY_SUPERVISE=0
