# WI-10002846 (incident 2026-09-24 00:52Z): every desktop terminal was killed.
#
# OBSERVED (user journal): a `systemctl --user daemon-reload`, issued by dev:restart
# inside papercusp-dev-api, took 11.6s under load. It ended with the user manager's
# session-bus connection closed. Every post-reload GetNameOwner() then failed with
# "Connection terminated", and systemd stopped every Type=dbus user unit in the same
# second: gnome-terminal-server (and with it every open tab), the GNOME settings
# daemons, IBus, the a11y bus and the desktop portals.
#
# MECHANISM (systemd 255, src/core/service.c): a GetNameOwner error is treated as
# "the name has no owner". For a Type=dbus unit in RUNNING, service_enter_running()
# then sees !bus_name_good and calls service_enter_stop(). Only Type=dbus uses
# bus-name ownership as its liveness verdict.
#
# FIX: Type=simple. D-Bus activation keeps working (dbus-daemon still waits for the
# name to appear before delivering the activating message) and the process is still
# supervised by PID. A bus hiccup can no longer stop the unit.
#
# This same file is tracked once per protected desktop unit (the sibling
# <unit>.service.d/10-survive-bus-drop.conf files point back here). Install by
# SYMLINK, never by copy:
#   mkdir -p ~/.config/systemd/user/<unit>.d
#   ln -sfn "$PWD/apps/operator/scripts/systemd/<unit>.d/10-survive-bus-drop.conf" \
#     ~/.config/systemd/user/<unit>.d/10-survive-bus-drop.conf
#   systemctl --user daemon-reload
# scripts/check-systemd-dropins-installed.mjs verifies it is LOADED (DropInPaths) on
# every host where the unit exists; hosts without a GNOME session skip it.
[Service]
Type=simple
