# EI-20340243384897336 / operator-memory-and-psu-resilience-2026-06-14 D-021.
#
# papercup-dev-api used to be a 17-process Node cluster on the shared development host.
# PAPERCUSP_MEMORY_WATCHDOG_LIMIT_MB is process-scoped, so the former 12 GiB
# service override multiplied into roughly 204 GiB of aggregate headroom and
# could not bound the cgroup. Return request workers to the role-aware watchdog
# default, then enforce one reclaim-first envelope over the whole service.
#
# EI-21203816636342220: sixteen request workers can each reach the role-aware
# 3200 MiB recycle ceiling while the background primary can reach 12288 MiB.
# Their 63488 MiB aggregate budget is already near MemoryMax and well above
# MemoryHigh; live pressure reproduced at 46.88 GiB + 5.19 GiB swap with 28,572
# memory.high events. Cap the request tier at ten via CLUSTER_WORKERS (the
# resolver's documented precedence over the legacy CLUSTER=16 drop-in):
# 10*3200 + 12288 = 44288 MiB, leaving 4864 MiB below the 48 GiB reclaim line.
# EXPECTED_OPERATOR_PROCS follows the actual ten workers + one primary so PG
# pool sizing remains conservative without pretending the retired workers exist.
#
# MemoryHigh throttles/reclaims; MemoryMax is the last-resort hard ceiling, not
# the steady-state target.
[Service]
UnsetEnvironment=PAPERCUSP_MEMORY_WATCHDOG_LIMIT_MB
Environment=PAPERCUSP_CLUSTER_WORKERS=10
Environment=PAPERCUSP_EXPECTED_OPERATOR_PROCS=11
MemoryAccounting=yes
MemoryHigh=48G
MemoryMax=64G
MemorySwapMax=16G
