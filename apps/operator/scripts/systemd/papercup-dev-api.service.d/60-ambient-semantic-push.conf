# EI-19363446107725373: activate the already-built ambient semantic warning rail.
#
# The dead-end matcher is the durable replacement for runtime tool-signature
# trip-wires: turn-end journal notes build a bounded lexical cursor, scoped
# `dead-end:*` facts are matched against it, and a self-directed warning rides
# the normal wake delivery path. The full path is fail-soft and covered by the
# real-PG acceptance drill; leaving this variable unset kept that shipped path
# dark and forced agents back to proactive facts:list recall after compaction.
#
# This is a versioned drop-in (rather than papercup-release/.env.local) so the
# activation survives deployments. Set the value to 0 in a later, higher-order
# drop-in for an immediate kill switch if the bounded matcher proves noisy.
[Service]
Environment=PAPERCUSP_AMBIENT_CURSOR=1
