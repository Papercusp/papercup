# D-137 / P-046: make the live dev-api controller's workspace-host trust store
# a private, service-owned state directory. This unit is a systemd USER service;
# /var/lib is not writable by the normal desktop user, so the resolver derives
# its absolute known_hosts path from the STATE_DIRECTORY environment that
# systemd exports for this declaration.
#
# Install this tracked drop-in as a symlink under
# ~/.config/systemd/user/papercup-dev-api.service.d/ and run
# `systemctl --user daemon-reload`; the repository's
# scripts/check-systemd-dropins-installed.mjs verifies that it is loaded.
[Service]
StateDirectory=papercusp/controller
StateDirectoryMode=0700
