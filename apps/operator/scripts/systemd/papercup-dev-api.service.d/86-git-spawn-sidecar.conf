# Request-host git spawn offload (WI-10002829 / P-007, 2026-09-26).
#
# Same fix and rationale as the staging request host's sibling drop-in
# (papercup-staging-api.service.d/86-git-spawn-sidecar.conf), which records the
# measured 17.6s popup stall on :3170. There, 84% of the saturated-loop profile
# was native `spawn` under gitPipelinePosition -> realGit. This green host runs
# the same resolver for every agent's dev:pipeline_position call, so it pays the
# same RSS-scaled fork cost on its main thread.
#
# Per-caller explicit variables only (never the broad PAPERCUSP_SPAWNER_SIDECAR
# switch, which belongs to the bg-host). The sidecar spawns lazily and is shared
# across cluster workers. A sidecar fault falls back to a local spawn. Guarded by
# apps/operator/scripts/__tests__/request-host-git-spawn-sidecar.test.ts.
[Service]
Environment=PAPERCUSP_DEV_DEPLOY_SPAWN_SIDECAR=1
Environment=PAPERCUSP_SYSTEM_HEALTH_SPAWN_SIDECAR=1
Environment=PAPERCUSP_GIT_PIPELINE_SPAWN_SIDECAR=1
Environment=PAPERCUSP_PLAN_AUDIT_SPAWN_SIDECAR=1
