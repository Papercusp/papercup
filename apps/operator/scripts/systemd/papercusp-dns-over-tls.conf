# Direct, authenticated DNS for the office workstation.
#
# The DHCP resolver at 192.168.40.1 has returned forged answers for Papercusp
# hostnames.  Pinning those names in /etc/hosts only traded that failure for a
# fragile local transport.  Keep resolution direct and authenticate the
# upstream resolvers instead.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
ReadEtcHosts=yes
