# WI-10002865: this optional demo service outlived the checkout it serves and
# accumulated a permanent ten-second restart loop. Keep the unit reusable if
# the demo returns, but skip activation while either required path is absent.
[Unit]
ConditionPathExists=%h/demos/papercusp-offsite-planner/serve-gallery.py
ConditionPathIsDirectory=%h/demos/papercusp-offsite-planner/public
