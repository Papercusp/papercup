<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="roles-map-title">
  <title id="roles-map-title">Papercusp coding-harness roles, grouped by responsibility</title>

  <!-- Background — transparent so the docs theme controls the page background -->

  <!-- Color palette
       Core dispatch       — orange  #f59e0b
       Quality gates       — purple  #a855f7
       Lifecycle/curation  — emerald #10b981
       Phase-specific      — sky     #38bdf8 -->

  <style>
    .col-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .role-name { font-size: 13px; font-weight: 600; }
    .role-desc { font-size: 10.5px; opacity: 0.75; }
    .legend    { font-size: 11px; opacity: 0.7; }
    .h-title   { font-size: 16px; font-weight: 700; }
    .text-fg   { fill: #e7e7e7; }
  </style>

  <text x="440" y="32" text-anchor="middle" class="h-title text-fg">Papercusp coding-harness roles</text>
  <text x="440" y="50" text-anchor="middle" class="legend text-fg">grouped by where each role lives in the autonomous loop</text>

  <!-- ───── Column 1 — CORE DISPATCH ───── -->
  <g transform="translate(40, 90)">
    <text x="125" y="-10" text-anchor="middle" class="col-title" fill="#f59e0b">Core dispatch</text>
    <rect x="0" y="0" width="250" height="464" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>

    <!-- orchestrator (highlighted — the brain) -->
    <g>
      <rect x="20" y="20" width="210" height="76" rx="8" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>
      <text x="125" y="44" text-anchor="middle" class="role-name text-fg">orchestrator</text>
      <text x="125" y="62" text-anchor="middle" class="role-desc text-fg">decides next action every</text>
      <text x="125" y="76" text-anchor="middle" class="role-desc text-fg">iteration • emits a single verb</text>
      <text x="125" y="90" text-anchor="middle" class="role-desc text-fg">(NEXT_WORKER, DONE, …)</text>
    </g>

    <!-- scoper -->
    <g>
      <rect x="20" y="116" width="210" height="68" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
      <text x="125" y="138" text-anchor="middle" class="role-name text-fg">scoper</text>
      <text x="125" y="156" text-anchor="middle" class="role-desc text-fg">SPEC.md → contract + queue</text>
      <text x="125" y="170" text-anchor="middle" class="role-desc text-fg">modes: initial / proposal / replan</text>
    </g>

    <!-- worker -->
    <g>
      <rect x="20" y="200" width="210" height="68" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
      <text x="125" y="222" text-anchor="middle" class="role-name text-fg">worker</text>
      <text x="125" y="240" text-anchor="middle" class="role-desc text-fg">implements one feature</text>
      <text x="125" y="254" text-anchor="middle" class="role-desc text-fg">in its own git worktree</text>
    </g>

    <!-- validator -->
    <g>
      <rect x="20" y="284" width="210" height="68" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
      <text x="125" y="306" text-anchor="middle" class="role-name text-fg">validator</text>
      <text x="125" y="324" text-anchor="middle" class="role-desc text-fg">verifies claims against code</text>
      <text x="125" y="338" text-anchor="middle" class="role-desc text-fg">passed / failing / status</text>
    </g>

    <!-- footnote inside the column -->
    <text x="125" y="380" text-anchor="middle" class="legend text-fg" font-style="italic">these four are the autonomous loop;</text>
    <text x="125" y="395" text-anchor="middle" class="legend text-fg" font-style="italic">everything else is invoked by the orchestrator</text>
    <text x="125" y="410" text-anchor="middle" class="legend text-fg" font-style="italic">on demand or by the substrate as a hook</text>
  </g>

  <!-- ───── Column 2 — QUALITY GATES ───── -->
  <g transform="translate(310, 90)">
    <text x="125" y="-10" text-anchor="middle" class="col-title" fill="#a855f7">Quality gates</text>
    <rect x="0" y="0" width="250" height="464" rx="10" fill="rgba(168,85,247,0.06)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>

    <g>
      <rect x="20" y="20" width="210" height="68" rx="8" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
      <text x="125" y="42" text-anchor="middle" class="role-name text-fg">architect</text>
      <text x="125" y="60" text-anchor="middle" class="role-desc text-fg">resolves spec ambiguity</text>
      <text x="125" y="74" text-anchor="middle" class="role-desc text-fg">SPEC patch or human review</text>
    </g>

    <g>
      <rect x="20" y="104" width="210" height="68" rx="8" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
      <text x="125" y="126" text-anchor="middle" class="role-name text-fg">reviewer</text>
      <text x="125" y="144" text-anchor="middle" class="role-desc text-fg">gates plans + scope proposals</text>
      <text x="125" y="158" text-anchor="middle" class="role-desc text-fg">VERDICT: accept / reject</text>
    </g>

    <g>
      <rect x="20" y="188" width="210" height="68" rx="8" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
      <text x="125" y="210" text-anchor="middle" class="role-name text-fg">debugger</text>
      <text x="125" y="228" text-anchor="middle" class="role-desc text-fg">hypothesizes WHY a feature</text>
      <text x="125" y="242" text-anchor="middle" class="role-desc text-fg">keeps failing • fires pre-worker</text>
    </g>

    <g>
      <rect x="20" y="272" width="210" height="68" rx="8" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
      <text x="125" y="294" text-anchor="middle" class="role-name text-fg">crosscheck</text>
      <text x="125" y="312" text-anchor="middle" class="role-desc text-fg">re-validates with a different</text>
      <text x="125" y="326" text-anchor="middle" class="role-desc text-fg">model • catches validator bias</text>
    </g>

    <g>
      <rect x="20" y="356" width="210" height="68" rx="8" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
      <text x="125" y="378" text-anchor="middle" class="role-name text-fg">ui-qa</text>
      <text x="125" y="396" text-anchor="middle" class="role-desc text-fg">opens a real browser</text>
      <text x="125" y="410" text-anchor="middle" class="role-desc text-fg">verifies UI behaviour</text>
    </g>
  </g>

  <!-- ───── Column 3 — LIFECYCLE / CURATION ───── -->
  <g transform="translate(580, 90)">
    <text x="125" y="-10" text-anchor="middle" class="col-title" fill="#10b981">Lifecycle / curation</text>
    <rect x="0" y="0" width="250" height="464" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>

    <g>
      <rect x="20" y="20" width="210" height="68" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
      <text x="125" y="42" text-anchor="middle" class="role-name text-fg">documenter</text>
      <text x="125" y="60" text-anchor="middle" class="role-desc text-fg">per-feature human docs</text>
      <text x="125" y="74" text-anchor="middle" class="role-desc text-fg">writes docs/features/F-XXX.md</text>
    </g>

    <g>
      <rect x="20" y="104" width="210" height="68" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
      <text x="125" y="126" text-anchor="middle" class="role-name text-fg">curator</text>
      <text x="125" y="144" text-anchor="middle" class="role-desc text-fg">distills raw observations</text>
      <text x="125" y="158" text-anchor="middle" class="role-desc text-fg">into MEMORY.md + summary.md</text>
    </g>

    <g>
      <rect x="20" y="188" width="210" height="68" rx="8" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="2"/>
      <text x="125" y="210" text-anchor="middle" class="role-name text-fg">project_manager</text>
      <text x="125" y="228" text-anchor="middle" class="role-desc text-fg">curates per-project spec</text>
      <text x="125" y="242" text-anchor="middle" class="role-desc text-fg">injected into worker context</text>
    </g>

    <g>
      <rect x="20" y="272" width="210" height="68" rx="8" fill="rgba(16,185,129,0.04)" stroke="rgba(16,185,129,0.4)" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="125" y="294" text-anchor="middle" class="role-name text-fg" opacity="0.85">summarizer</text>
      <text x="125" y="312" text-anchor="middle" class="role-desc text-fg">recent-activity narrative</text>
      <text x="125" y="326" text-anchor="middle" class="role-desc text-fg">(department harnesses only)</text>
    </g>

    <text x="125" y="370" text-anchor="middle" class="legend text-fg" font-style="italic">project_manager curates context;</text>
    <text x="125" y="385" text-anchor="middle" class="legend text-fg" font-style="italic">curator curates lessons;</text>
    <text x="125" y="400" text-anchor="middle" class="legend text-fg" font-style="italic">documenter writes for humans.</text>
    <text x="125" y="415" text-anchor="middle" class="legend text-fg" font-style="italic">three audiences, three artifacts.</text>
  </g>

  <!-- Bottom note: phase + org variants -->
  <g transform="translate(40, 575)">
    <text x="0" y="0" class="legend text-fg">
      <tspan font-weight="600">Not shown:</tspan>
      <tspan dx="6">phase variants (testing → tester / test-writer / security-reviewer; production → monitor) and</tspan>
    </text>
    <text x="0" y="16" class="legend text-fg">
      <tspan>org-topology roles (parent: director / coordinator / auditor; departments: dept-orchestrator / dept-worker / dept-validator / dept-documenter / dept-summarizer).</tspan>
    </text>
  </g>
</svg>
