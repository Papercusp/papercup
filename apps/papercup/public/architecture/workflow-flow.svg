<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1040" viewBox="0 0 880 1040" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="workflow-flow-title">
  <title id="workflow-flow-title">Feature lifecycle in a Papercusp coding harness — from SPEC.md to DONE</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .h-title    { font-size: 16px; font-weight: 700; fill: #e7e7e7; }
    .h-sub      { font-size: 11.5px; fill: #e7e7e7; opacity: 0.65; }
    .role       { font-size: 13px; font-weight: 600; fill: #e7e7e7; }
    .role-mini  { font-size: 12px; font-weight: 600; fill: #e7e7e7; }
    .desc       { font-size: 10.5px; fill: #e7e7e7; opacity: 0.7; }
    .verb       { font-size: 11px; font-weight: 600; fill: #f59e0b; font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; letter-spacing: 0.02em; }
    .arrow-lbl  { font-size: 10.5px; fill: #aaa; font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace; }
    .stage-lbl  { font-size: 11px; font-weight: 600; fill: #888; text-transform: uppercase; letter-spacing: 0.1em; }
    .anchor     { font-size: 11px; font-weight: 600; fill: #e7e7e7; }
  </style>

  <text x="440" y="32" text-anchor="middle" class="h-title">Feature lifecycle — autonomous loop</text>
  <text x="440" y="50" text-anchor="middle" class="h-sub">from a fresh SPEC.md through every dispatched role and back to DONE</text>

  <!-- ───── STAGE 1 — Mission start ───── -->
  <text x="60" y="100" class="stage-lbl">1 — mission start</text>

  <!-- SPEC.md anchor -->
  <g>
    <rect x="60" y="115" width="160" height="42" rx="6" fill="rgba(255,255,255,0.04)" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="140" y="142" text-anchor="middle" class="anchor">SPEC.md (user-authored)</text>
  </g>
  <line x1="220" y1="136" x2="290" y2="136" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- scoper(initial) -->
  <g>
    <rect x="290" y="113" width="170" height="46" rx="8" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="375" y="135" text-anchor="middle" class="role">scoper</text>
    <text x="375" y="151" text-anchor="middle" class="desc">MODE=initial</text>
  </g>
  <line x1="460" y1="136" x2="525" y2="136" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="129" text-anchor="middle" class="arrow-lbl">writes</text>

  <!-- writes contract + queue -->
  <g>
    <rect x="525" y="113" width="200" height="46" rx="6" fill="rgba(255,255,255,0.04)" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="625" y="133" text-anchor="middle" class="anchor">validation-contract.md</text>
    <text x="625" y="151" text-anchor="middle" class="anchor">+ harness_features rows</text>
  </g>

  <!-- arrow down to reviewer -->
  <line x1="375" y1="159" x2="375" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- reviewer(plan) -->
  <g>
    <rect x="290" y="200" width="170" height="46" rx="8" fill="rgba(168,85,247,0.16)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="375" y="222" text-anchor="middle" class="role">reviewer</text>
    <text x="375" y="238" text-anchor="middle" class="desc">MODE=plan • verdict</text>
  </g>

  <text x="495" y="225" class="desc">accept-with-notes ⇒ enter loop</text>
  <text x="495" y="240" class="desc">reject ⇒ escalate to human</text>

  <!-- ───── STAGE 2 — main loop ───── -->
  <text x="60" y="288" class="stage-lbl">2 — main loop · the orchestrator runs every iteration</text>

  <!-- Big box around the loop region -->
  <rect x="50" y="300" width="780" height="510" rx="14" fill="rgba(245,158,11,0.04)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- orchestrator at top center -->
  <g>
    <rect x="350" y="320" width="180" height="60" rx="10" fill="rgba(245,158,11,0.22)" stroke="#f59e0b" stroke-width="2"/>
    <text x="440" y="343" text-anchor="middle" class="role">orchestrator</text>
    <text x="440" y="361" text-anchor="middle" class="desc">reads state · emits one verb</text>
    <text x="440" y="375" text-anchor="middle" class="desc">DONE / NEXT_… / CONVERTED / ESCALATE</text>
  </g>

  <!-- decision branches (5 branches fanning out below) -->
  <!-- Branch labels are decision verbs, color-coded -->

  <!-- Branch 1: NEXT_WORKER -->
  <line x1="395" y1="380" x2="125" y2="430" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="180" y="408" class="verb">NEXT_WORKER</text>

  <!-- Branch 2: NEXT_ARCHITECT -->
  <line x1="430" y1="380" x2="320" y2="430" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="290" y="412" class="verb" fill="#a855f7">NEXT_ARCHITECT</text>

  <!-- Branch 3: NEXT_PROJECT_MANAGER -->
  <line x1="450" y1="380" x2="510" y2="430" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="445" y="430" class="verb" fill="#10b981" text-anchor="end">NEXT_PROJECT_MANAGER</text>

  <!-- Branch 4: CONVERTED (issues→features) — drawn smaller -->
  <line x1="480" y1="380" x2="650" y2="430" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="412" class="verb" fill="#888">CONVERTED</text>

  <!-- Branch 5: DONE / ESCALATE — drawn far right -->
  <line x1="510" y1="380" x2="775" y2="430" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="775" y="412" class="verb" fill="#888" text-anchor="end">DONE / ESCALATE</text>

  <!-- ─ branch landings ─ -->

  <!-- (1) Worker pipeline: debugger? → worker → validator -->
  <g>
    <!-- conditional debugger (dashed — only fires if attempts ≥ threshold) -->
    <rect x="65" y="430" width="140" height="42" rx="8" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.6)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="135" y="450" text-anchor="middle" class="role-mini">debugger</text>
    <text x="135" y="464" text-anchor="middle" class="desc">if attempts ≥ 3</text>

    <line x1="135" y1="472" x2="135" y2="500" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="65" y="500" width="140" height="42" rx="8" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="135" y="528" text-anchor="middle" class="role-mini">worker</text>

    <line x1="135" y1="542" x2="135" y2="570" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="65" y="570" width="140" height="42" rx="8" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="135" y="598" text-anchor="middle" class="role-mini">validator</text>

    <!-- if passed → post-pass chain (crosscheck → ui-qa → documenter → PM) -->
    <line x1="135" y1="612" x2="135" y2="638" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="200" y="630" class="desc">if passed</text>

    <rect x="65" y="638" width="140" height="36" rx="6" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.5)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="135" y="660" text-anchor="middle" class="role-mini">crosscheck</text>

    <line x1="135" y1="674" x2="135" y2="694" stroke="#666" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

    <rect x="65" y="694" width="140" height="36" rx="6" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.5)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="135" y="710" text-anchor="middle" class="role-mini">ui-qa</text>
    <text x="135" y="722" text-anchor="middle" class="desc">UI features only</text>

    <line x1="135" y1="730" x2="135" y2="750" stroke="#666" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

    <rect x="65" y="750" width="140" height="36" rx="6" fill="rgba(16,185,129,0.16)" stroke="#10b981" stroke-width="1.2"/>
    <text x="135" y="772" text-anchor="middle" class="role-mini">documenter</text>
  </g>

  <!-- (2) Architect path -->
  <g>
    <rect x="240" y="430" width="160" height="46" rx="8" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="320" y="452" text-anchor="middle" class="role-mini">architect</text>
    <text x="320" y="468" text-anchor="middle" class="desc">spec-suspect failure</text>

    <text x="320" y="498" text-anchor="middle" class="desc">writes a SPEC patch as a</text>
    <text x="320" y="512" text-anchor="middle" class="desc">proposal block, OR a</text>
    <text x="320" y="526" text-anchor="middle" class="desc">pending-reviews/&lt;id&gt;.json</text>

    <line x1="320" y1="540" x2="320" y2="572" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

    <rect x="240" y="572" width="160" height="46" rx="8" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.6)" stroke-width="1"/>
    <text x="320" y="594" text-anchor="middle" class="role-mini">reviewer</text>
    <text x="320" y="610" text-anchor="middle" class="desc">MODE=proposal</text>

    <text x="320" y="640" text-anchor="middle" class="desc">if accepted →</text>
    <text x="320" y="655" text-anchor="middle" class="desc">scoper(replan)</text>
  </g>

  <!-- (3) Project Manager path -->
  <g>
    <rect x="430" y="430" width="180" height="46" rx="8" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="1.5"/>
    <text x="520" y="452" text-anchor="middle" class="role-mini">project_manager</text>
    <text x="520" y="468" text-anchor="middle" class="desc">batched per project</text>

    <text x="520" y="498" text-anchor="middle" class="desc">consumes pm_due events</text>
    <text x="520" y="512" text-anchor="middle" class="desc">decides include / exclude</text>
    <text x="520" y="526" text-anchor="middle" class="desc">per recently-passed feature</text>

    <line x1="520" y1="540" x2="520" y2="568" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

    <rect x="430" y="568" width="180" height="46" rx="6" fill="rgba(255,255,255,0.04)" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="520" y="590" text-anchor="middle" class="anchor">projects.spec</text>
    <text x="520" y="606" text-anchor="middle" class="desc">+ project_spec_revisions row</text>

    <text x="520" y="638" text-anchor="middle" class="desc">spec is auto-injected into worker /</text>
    <text x="520" y="652" text-anchor="middle" class="desc">validator / scoper prompts when</text>
    <text x="520" y="666" text-anchor="middle" class="desc">they touch a feature in this project</text>
  </g>

  <!-- (4) CONVERTED — issues to features (small box) -->
  <g>
    <rect x="640" y="430" width="160" height="36" rx="6" fill="rgba(255,255,255,0.04)" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="720" y="452" text-anchor="middle" class="anchor">issues.json → features</text>
    <text x="720" y="466" text-anchor="middle" class="desc">orchestrator promotes itself</text>

    <line x1="720" y1="478" x2="720" y2="510" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

    <text x="720" y="518" text-anchor="middle" class="desc">F-FIX-NNN added</text>
    <text x="720" y="532" text-anchor="middle" class="desc">to the queue</text>
  </g>

  <!-- ───── STAGE 3 — terminal ───── -->
  <text x="60" y="850" class="stage-lbl">3 — terminal · DONE or ESCALATE wraps the mission</text>

  <!-- DONE / ESCALATE → curator -->
  <g>
    <rect x="60" y="865" width="180" height="46" rx="8" fill="rgba(255,255,255,0.06)" stroke="#888" stroke-width="1.5"/>
    <text x="150" y="887" text-anchor="middle" class="anchor">DONE</text>
    <text x="150" y="903" text-anchor="middle" class="desc">all features passed</text>
  </g>
  <g>
    <rect x="260" y="865" width="180" height="46" rx="8" fill="rgba(252,165,165,0.10)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="350" y="887" text-anchor="middle" class="anchor">ESCALATE</text>
    <text x="350" y="903" text-anchor="middle" class="desc">stuck or out of budget</text>
  </g>
  <line x1="240" y1="888" x2="540" y2="888" stroke="#888" stroke-width="0" />
  <line x1="150" y1="911" x2="150" y2="945" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="911" x2="350" y2="945" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="160" y="945" width="280" height="50" rx="8" fill="rgba(16,185,129,0.18)" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="970" text-anchor="middle" class="role">curator</text>
    <text x="300" y="987" text-anchor="middle" class="desc">writes MEMORY.md + summary.md • merges issues</text>
  </g>

  <!-- Right side legend / annotation -->
  <g transform="translate(480, 830)">
    <rect x="0" y="40" width="370" height="170" rx="8" fill="rgba(255,255,255,0.03)" stroke="#444" stroke-width="1"/>
    <text x="14" y="62" class="role-mini">Legend</text>

    <rect x="14" y="76" width="14" height="14" rx="3" fill="rgba(245,158,11,0.22)" stroke="#f59e0b"/>
    <text x="36" y="87" class="desc" font-size="11.5px">Core dispatch (the autonomous loop)</text>

    <rect x="14" y="98" width="14" height="14" rx="3" fill="rgba(168,85,247,0.18)" stroke="#a855f7"/>
    <text x="36" y="109" class="desc" font-size="11.5px">Quality gates (architect / reviewer / debugger / crosscheck / ui-qa)</text>

    <rect x="14" y="120" width="14" height="14" rx="3" fill="rgba(16,185,129,0.18)" stroke="#10b981"/>
    <text x="36" y="131" class="desc" font-size="11.5px">Lifecycle / curation (documenter / curator / project_manager)</text>

    <rect x="14" y="142" width="14" height="14" rx="3" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.5)" stroke-dasharray="4 3"/>
    <text x="36" y="153" class="desc" font-size="11.5px">Optional / conditional (fires only if config + state match)</text>

    <rect x="14" y="164" width="14" height="14" rx="3" fill="rgba(255,255,255,0.04)" stroke="#666" stroke-dasharray="4 3"/>
    <text x="36" y="175" class="desc" font-size="11.5px">State / artifact (a file or DB row, not a role)</text>

    <text x="14" y="197" class="desc" font-size="11px" font-style="italic">Crosscheck + ui-qa fire only after a primary validator pass.</text>
  </g>
</svg>
