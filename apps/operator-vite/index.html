<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papercusp Operator</title>
    <script>
      (() => {
        const suppress =
          location.origin === 'http://localhost:3070'
          || location.origin === 'http://127.0.0.1:3070'
          || location.origin === 'http://localhost:4173'
          || location.origin === 'http://127.0.0.1:4173';
        if (!suppress) return;

        try {
          const originalReload = location.reload.bind(location);
          const originalAssign = location.assign.bind(location);
          const originalReplace = location.replace.bind(location);
          const softNavigate = (target, replace) => {
            try {
              const next = new URL(String(target), location.href);
              if (next.origin !== location.origin) return false;
              const href = `${next.pathname}${next.search}${next.hash}`;
              if (replace) history.replaceState({}, '', href);
              else history.pushState({}, '', href);
              window.dispatchEvent(new PopStateEvent('popstate'));
              return true;
            } catch {
              return false;
            }
          };
          Object.defineProperty(location, 'reload', {
            configurable: true,
            value: () => {
              console.info('[Papercusp] JS reload suppressed on static desktop host — use Cmd/Ctrl+R for manual refresh.');
            },
          });
          Object.defineProperty(location, 'assign', {
            configurable: true,
            value: (target) => {
              if (softNavigate(target, false)) return;
              originalAssign(target);
            },
          });
          Object.defineProperty(location, 'replace', {
            configurable: true,
            value: (target) => {
              if (softNavigate(target, true)) return;
              originalReplace(target);
            },
          });
          Object.defineProperty(window, '__papercuspOriginalReload', {
            configurable: true,
            value: originalReload,
          });
          document.addEventListener('click', (event) => {
            const target = event.target;
            if (!(target instanceof Element)) return;
            const anchor = target.closest('a[href]');
            if (!(anchor instanceof HTMLAnchorElement)) return;
            if (event.defaultPrevented) return;
            if (event.button !== 0) return;
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            if (anchor.hasAttribute('download')) return;
            if (anchor.target === '_blank') return;
            if (softNavigate(anchor.href, false)) {
              event.preventDefault();
            }
          }, true);
        } catch {
          // Best effort — some browsers disallow redefining location methods.
        }
      })();
    </script>
    <!--
      Color theme (pre-paint).

      Mirrors apps/operator/app/layout.tsx's themeBootstrapScript. This SPA is
      client-rendered, so without this the page would paint frost then flip to
      the saved theme once React mounts the selector. Sets data-theme on <html>
      synchronously from the wsLocalKey-scoped value (pc:ws:<id>:papercusp.theme),
      using the same getBrowserWorkspaceId() resolution as lib/theme.ts so this
      read and the React lib always agree on the key. Frost is the :root default.
    -->
    <script>
      (() => {
        const KEY = 'papercusp.theme';
        const DEFAULT = 'frost';
        const wsId = () => {
          try { if (window.__PAPERCUSP_WS__ && String(window.__PAPERCUSP_WS__).trim()) return window.__PAPERCUSP_WS__; } catch (e) {}
          try { const ws = new URL(window.location.href).searchParams.get('ws'); if (ws && ws.trim()) return ws; } catch (e) {}
          return 'default';
        };
        const valid = (v) => typeof v === 'string' && (v === 'frost' || v === 'black' || (v.indexOf('custom:') === 0 && v.length > 7));
        try {
          let id = window.localStorage.getItem('pc:ws:' + wsId() + ':' + KEY);
          if (!valid(id)) id = DEFAULT;
          document.documentElement.dataset.theme = id;
        } catch (e) {
          document.documentElement.dataset.theme = DEFAULT;
        }
      })();
    </script>
    <!--
      Operator-chat sidebar width reservation (pre-paint).

      The steady-state copy of these rules lives in OperatorChatSidebar's
      inlined <style> (OP_CHAT_SIDEBAR_CSS). In the Next operator that
      component is server-rendered, so the rule exists at first paint; here
      operator-vite is a client-rendered SPA, so it would not exist until
      React mounts the sidebar. Inlining the reservation rules in <head>
      (loaded before paint in both dev and the built desktop bundle) plus
      the body-start bootstrap script below reserves the sidebar column
      before React mounts, so the page paints already shifted instead of
      full-width-then-jumping. Values mirror operator-chat-layout.ts
      (default/min 360px, collapsed 56px) and the component's own copy.
    -->
    <style id="op-chat-width-reserve">
      body.has-op-chat { padding-left: var(--op-chat-w, 360px); }
      body.has-op-chat .pc-header {
        left: var(--op-chat-w, 360px);
        width: calc(100vw - var(--op-chat-w, 360px));
      }
    </style>
  </head>
  <body>
    <!--
      Set --op-chat-w + the body classes the reservation CSS above gates on,
      synchronously before React. Mirrors apps/operator/app/layout.tsx's
      operatorChatBootstrapScript. A classic (non-module) script at <body>
      start runs before the deferred module entry below, and document.body
      already exists. Reads the same workspace-scoped width key the sidebar
      writes (pc:ws:<id>:papercusp.operatorChat.width) so a drag-resized
      width is honored on first paint, not only the default.
    -->
    <script>
      (() => {
        try {
          var path = location.pathname || '';
          var chromeless = ['/pi', '/project-docs', '/el-min'];
          if (chromeless.some(function (p) { return path === p || path.indexOf(p + '/') === 0; })) return;
          var params = new URLSearchParams(location.search || '');
          var open = params.get('chat') !== 'false';
          var ws = window.__PAPERCUSP_WS__ || 'default';
          var stored = window.localStorage.getItem('pc:ws:' + ws + ':papercusp.operatorChat.width');
          var w = open ? 360 : 56;
          if (open && stored) {
            var n = Number(stored);
            if (Number.isFinite(n) && n >= 360) {
              var ceiling = Math.max(360, Math.floor(window.innerWidth * 0.75));
              w = Math.min(n, ceiling);
            }
          }
          document.documentElement.style.setProperty('--op-chat-w', w + 'px');
          document.body.classList.add('has-op-chat');
          document.body.classList.toggle('op-chat-collapsed', !open);
        } catch (_) { /* best effort — never block boot on the reservation */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
