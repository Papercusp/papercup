[package]
name = "pui"
version = "0.1.0"
edition = "2021"
description = "Papercusp terminal workbench (TUI) — SP-TUI tui-workbench-ratatui-2026-06-04"
publish = false

# Standalone crate: there is no Cargo workspace under papercup/, so this never
# participates in (or breaks) a peer's workspace build. Run from apps/tui/.

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
# HTTP-only (no TLS): the operator is local http://127.0.0.1, so we skip the
# rustls/openssl/aws-lc dependency tree entirely.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
