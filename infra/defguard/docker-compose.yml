# Defguard control plane for Papercusp mobile mesh.
# Deploy on a $5/mo Hetzner CX22 box (or equivalent).
#
# Prereqs (on the VPS):
#   - Docker + docker-compose installed
#   - DNS A records: mesh.papercuspai.com → <vps-ip>, relay.papercuspai.com → <vps-ip> (Cloudflare proxy OFF)
#   - Ports 80, 443, 50051 (gRPC), 51820/UDP (WireGuard) open in the Hetzner firewall
#
# Bring up:
#   cp .env.example .env && vim .env  # set DEFGUARD_SECRET_KEY, RP_ID, etc.
#   docker compose pull
#   docker compose up -d
#
# First-time bootstrap: the `core` container will print an admin enrollment URL on
# first boot (see `docker compose logs core`). Open it once to create the admin account.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: defguard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: defguard
    volumes:
      - pgdata:/var/lib/postgresql/data

  core:
    image: ghcr.io/defguard/defguard:latest
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DEFGUARD_DB_HOST: postgres
      DEFGUARD_DB_PORT: 5432
      DEFGUARD_DB_NAME: defguard
      DEFGUARD_DB_USER: defguard
      DEFGUARD_DB_PASSWORD: ${DB_PASSWORD}
      DEFGUARD_SECRET_KEY: ${DEFGUARD_SECRET_KEY}
      DEFGUARD_AUTH_SECRET: ${DEFGUARD_AUTH_SECRET}
      DEFGUARD_GATEWAY_SECRET: ${DEFGUARD_GATEWAY_SECRET}
      DEFGUARD_YUBIBRIDGE_SECRET: ${DEFGUARD_YUBIBRIDGE_SECRET}
      DEFGUARD_URL: https://mesh.papercuspai.com
      DEFGUARD_WEBAUTHN_RP_ID: mesh.papercuspai.com
      DEFGUARD_ENROLLMENT_URL: https://mesh.papercuspai.com/enroll
      DEFGUARD_DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"  # HTTP (behind Caddy)
      - "0.0.0.0:50051:50051"  # gRPC for gateways
    volumes:
      - core-data:/var/lib/defguard

  # Defguard v2 gateway. NO token env: v2 replaced the GATEWAY_TOKEN handshake
  # with an ADOPTION flow — Core dials this container on :50066 (see the
  # README's "Adopt the gateway" step) and they exchange a CSR/signed cert,
  # which lands in the certs volume below. A `DEFGUARD_TOKEN` here is inert.
  #
  # host networking is required: the gateway creates the wg0 interface in the
  # host netns and binds 51820/udp + 50066/tcp there directly. Adoption opens a
  # 10-minute window on container start; `restart` reopens it.
  gateway:
    image: ghcr.io/defguard/gateway:latest
    restart: unless-stopped
    depends_on: [core]
    network_mode: host
    cap_add: [NET_ADMIN]
    # Debian 13+ / AppArmor / SELinux hosts refuse the wg netlink calls otherwise.
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./.volumes/certs/gateway:/etc/defguard/certs
    # NOTE: no `sysctls:` here — Docker rejects namespaced sysctls together with
    # network_mode: host. Set forwarding on the HOST instead:
    #   sysctl -w net.ipv4.ip_forward=1   (persist in /etc/sysctl.d/)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [core]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  core-data:
  caddy-data:
  caddy-config:
