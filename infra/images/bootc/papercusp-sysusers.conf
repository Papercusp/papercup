# P-306 — the three workspace-host identities, with PINNED uid/gid.
#
# Installed to /usr/lib/sysusers.d/. Two things follow from that location, and the
# second is why this file exists rather than three `useradd` lines:
#
#  1. `systemd-sysusers` runs at image build time, so the entries are in the
#     image's /etc/passwd exactly as `useradd` would have left them;
#  2. systemd ALSO re-applies it on the deployed host, so an identity that is
#     somehow missing from a merged /etc is recreated with the SAME numbers.
#
# ── Why the numbers are pinned ────────────────────────────────────────────────
#
# `useradd` allocates system ids by counting DOWN from 999, in package install
# order. Measured on the first build of this image: papercusp got uid 992 with
# gid 995, papercusp-agent uid 985 with gid 982 — the uid and gid are allocated
# from separate counters and do not even correspond.
#
# That is stable only for as long as the package set is. Add one package that
# creates a system user, or reorder the dnf list, and the next image assigns
# different numbers. On an ordinary host that is harmless because the host is
# never rebuilt. On THIS host model it is a live hazard, and it is created by the
# very update path this port introduces:
#
#     `/var` is machine-local and PERSISTS across `bootc upgrade`. `/etc/passwd`
#     comes from the IMAGE. So an upgrade that renumbers papercusp-agent leaves
#     /var/home/papercusp-agent owned by the OLD uid, which is now either nobody
#     or some other account. The agent identity can no longer read its own
#     delivered credentials, and the host reports healthy throughout — the files
#     are all present, correctly sized, and owned by a uid that exists.
#
# So the numbers below are part of the contract, not an implementation detail.
# ⛔ NEVER renumber them. A host provisioned from an older image has files on
# persistent storage owned by these exact ids.
#
# Chosen low in the system range (910/911) precisely because `useradd` allocates
# downward from 999: a package added later cannot collide with them. The base
# image has NO users or groups in 900-999 at all (measured 2026-09-04), so the
# range is genuinely free rather than merely unoccupied today.

# ── Identity 1: the runtime service (D-043) ───────────────────────────────────
g papercusp           910
u papercusp           910:910 "Papercusp runtime service" /var/lib/papercusp /usr/sbin/nologin

# ── Identity 3: the agent runtime (D-248) ─────────────────────────────────────
# Reads the signed runtime and owns the delivered agent credential homes, and is
# NOT the SSH account. That separation is what lets D-043's "runtime files are not
# readable by the workspace user" hold as written while the agents still run.
g papercusp-agent     911
u papercusp-agent     911:911 "Papercusp agent runtime" /home/papercusp-agent /usr/sbin/nologin

# ── Identity 2: the customer's SSH login ──────────────────────────────────────
# The only one with a real shell. Pinned in the regular range rather than the
# system range because that is where an interactive login belongs, and well clear
# of 1000 — a cloud image's own default/guest account commonly takes 1000, and a
# collision there would silently merge the customer's login with it.
g papercusp-workspace 1500
u papercusp-workspace 1500:1500 "Papercusp workspace SSH user" /home/papercusp-workspace /bin/bash
