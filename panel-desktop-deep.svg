                <text x="63.5" y="225.2" fill="#8ea9c0" font-size="3.1">every recurring timer visible — a bare</text>
                <text x="63.5" y="229.2" fill="#8ea9c0" font-size="3.1">setInterval fails the lint</text>
                <rect x="163.5" y="212.2" width="100.5" height="23.4" rx="3" fill="rgba(18,38,63,.6)" stroke="rgba(96,168,214,.3)" stroke-width=".5"/>
