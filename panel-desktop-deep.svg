                <text x="63.5" y="194.7" fill="#7dd3fc" font-size="3.5" font-weight="600">processes:freeze</text>
                <text x="63.5" y="198.8" fill="#8ea9c0" font-size="3.1">relieve pressure without losing work —</text>
                <text x="63.5" y="202.8" fill="#8ea9c0" font-size="3.1">kills go by task id through the cgroup</text>
                <rect x="163.5" y="185.8" width="100.5" height="23.4" rx="3" fill="rgba(18,38,63,.6)" stroke="rgba(96,168,214,.3)" stroke-width=".5"/>
