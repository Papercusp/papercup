                <text x="63.5" y="148.0" fill="#8ea9c0" font-size="3.1">read the screen you see, drive its controls</text>
                <rect x="163.5" y="133.0" width="100.5" height="23.4" rx="3" fill="rgba(18,38,63,.6)" stroke="rgba(96,168,214,.3)" stroke-width=".5"/>
