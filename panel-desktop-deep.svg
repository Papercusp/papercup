              <g class="lod1" opacity="0" data-f0="8" data-f1="10">
                <rect x="54" y="114" width="216" height="154" rx="11" fill="#0d1b2f" fill-opacity="1" stroke="rgba(94,234,212,.4)"/>
                <text x="162" y="127" fill="#5eead4" font-size="5" font-weight="700" text-anchor="middle">DESKTOP — the operator's real surface</text>
