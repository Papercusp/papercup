                <text x="167.0" y="148.0" fill="#8ea9c0" font-size="3.1">live values at act time — never stale copies</text>
                <rect x="60.0" y="159.4" width="100.5" height="23.4" rx="3" fill="rgba(18,38,63,.6)" stroke="rgba(96,168,214,.3)" stroke-width=".5"/>
                <text x="63.5" y="170.3" fill="#7dd3fc" font-size="3.5" font-weight="600">state:subscribe</text>
                <text x="63.5" y="174.4" fill="#8ea9c0" font-size="3.1">woken on the edge crossing — no poll loops</text>
                <rect x="163.5" y="159.4" width="100.5" height="23.4" rx="3" fill="rgba(18,38,63,.6)" stroke="rgba(96,168,214,.3)" stroke-width=".5"/>
