name: Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Dev-box-parity PG (WI-123): ~30 "unit"-tier suites transitively open a
      # pool against the default localhost:5432/papercusp (connection.ts
      # resolution chain) — they pass on any box with a provisioned native
      # :5432 and ECONNREFUSE here without one. pgvector image because the
      # baseline schema has vector(N) columns (same image as the
      # testcontainers integration tier).
      # WI-2942 (2026-07-05): pg16 -> pg18 to match the shipped/embedded operator
      # (PostgreSQL 18.3) — see libs/test-config/src/pg-container.ts.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Doctor (Docker + node)
        run: node scripts/test-doctor.mjs

      # Bring the PG service to schema head with the real boot-path migration
      # runner (roles + extensions + 000-baseline + sql/*.sql) so suites that
      # transitively resolve the default :5432/papercusp URL find the same
      # environment the dev box / green-checkpoint tree provide. ~4s.
      - name: Provision papercusp PG (dev-box parity)
        env:
          CI_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node scripts/ci-provision-pg.mjs

      - name: Cache testcontainers Docker layer
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: testcontainers-${{ runner.os }}-postgres-16-alpine

      - name: Run affected unit + integration suites
        env:
          AFFECTED_BASE: origin/${{ github.base_ref || 'main' }}
          CI: 'true'
        run: node scripts/affected-tests.mjs --integration

      # Plan-doc lint — fast read-only check against apps/operator/docs/plans/.
      # Fails the build on any error; warnings (e.g. missing ## Now)
      # surface in logs but don't gate. Legacy plans (no frontmatter)
      # are exempt by lintPlan itself. Spec: /internal/docs/spec/plan-format.
      - name: Lint plans
        working-directory: apps/operator
        run: npm run lint:plans

      # Plans are PG-canonical (plans-pg-canonical-migration-2026-06-03): fail on any
      # filesystem read of plan markdown outside source.ts / the backfill script.
      - name: Lint plans PG-canonical (no FS reads of plan markdown)
        working-directory: apps/operator
        run: npm run lint:plans-pg

      # Four-framework guard (admin-testing-tab-restructure P-038): fails on a new
      # .mjs under __tests__/integration/, a *-smoke.ts under scripts/, OR a
      # canonical test that matches no registry glob (invisible in the /adv tab).
      - name: Lint tests (four-framework + tab-coverage guard)
        working-directory: apps/operator
        run: npm run lint:tests

      # The /adv Tests-tab contract (.papercusp/testing-domains.json) is GENERATED
      # from testing-domains-registry.ts. Fail if it drifted (edit the registry,
      # then `npm run gen:contract`).
      - name: Check testing-domains contract is in sync
        run: npm run gen:contract:check

      # BORROWABLE.md is GENERATED from scripts/gen-borrowable-catalog.mjs (the
      # curated libs/generic membership + .gitmodules). Fail if it drifted — every
      # code-derived surface is CI-gated so it can't go stale
      # (docs-and-memory-as-projections-2026-06-05 D-002).
      - name: Check BORROWABLE catalog is in sync
        run: npm run gen:borrowable:check

      # Starlight projection pages (starlight-projection-generators-2026-06-05, Brief 29)
      # are GENERATED from code/registry/PG into apps/operator-docs/.../reference/. The
      # LOW-CHURN two (blueprint catalog / role registry) are pure fs/code reads of
      # rarely-changing sources → GATING (fail on drift, like BORROWABLE).
      - name: Check generated reference pages are in sync (low-churn, gating)
        run: |
          npm run gen:doc-blueprint-catalog:check
          npm run gen:doc-role-registry:check

      # The insights index (the fleet adds insights continuously — measured stale
      # within ~25 min), the tool catalog (heavy full-registry import, fleet-fragile)
      # + the plans index (PG-dependent, churns constantly) are INFORMATIONAL — does
      # not gate (D-002, the docs-and-memory D-009 flap lesson). plans-index degrades
      # to a no-op with no DB. Surfaces drift in the CI log without blocking the merge.
      - name: Check generated reference pages (informational — does not gate)
        if: always()
        continue-on-error: true
        run: |
          npm run gen:doc-insights-index:check
          npm run gen:doc-tool-catalog:check
          npm run gen:doc-plans-index:check

      # Generic-first guard (generalize-libs-to-generic-2026-06-05 D-005): nudge a
      # zero-coupling, concept-naming algorithm file that landed in the app toward
      # libs/generic. Heuristic, so INFORMATIONAL — does not gate (like lint:knip).
      # Diff-scoped against origin/main; surfaces candidates in the CI log.
      - name: Generic-first lint (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npm run lint:generic-first

      # Feature-gate guard (default-on-policy-enforcement 2026-06-16): a user-facing
      # feature toggle must be a FLAGS entry (default-on enforced + /admin/features-
      # flippable), NOT an ad-hoc process.env.PAPERCUSP_* boolean (which ships dark).
      # GATING (--strict): a NEW un-classified boolean env gate fails the build —
      # classify it as a FLAG, or add it to ALLOW in scripts/check-env-feature-gates.mjs.
      - name: Env feature-gate lint (gating)
        run: npm run lint:env-feature-gates:strict

      # Affected-set integrity guard: the gate must not silently run FEWER tests than
      # it appears to. `--ignore-submodules=all` used to suppress gitlink changes, so a
      # commit touching only a submodule (e.g. the memory lib) produced an empty affected
      # set and ZERO tests ran while the gate reported green. This must be a LINT, not a
      # vitest test: a test only runs when its workspace is affected, so the very bug it
      # guards would disarm it. GATING.
      - name: Lint affected-set gate integrity
        run: npm run lint:affected-gate

      # Workspace-deps-complete guard (EI-9831): a workspace that imports a local
      # @papercusp/* package without declaring it is invisible to the affected-set
      # reverse-dep walk (same failure class as lint:affected-gate's memory-only check
      # #4, generalized to every local package). GATING on a NEW undeclared edge; a
      # shrink-to-empty BASELINE grandfathers the 60 pre-existing edges found 2026-07-12.
      - name: Lint workspace deps complete
        run: npm run lint:workspace-deps-complete

      # @restart retirement guard: the shared libs were renamed @restart/* ->
      # @papercusp/* (papercusp-systems-abstraction-2026-05-29). GATING — fails
      # the build with a "use @papercusp/<name>" message if any @restart/* import
      # or dep reappears, so a straggler never silently resolves.
      - name: Lint no-restart imports
        run: npm run lint:no-restart

      # no-raw-setInterval guard (schedule-inventory-and-ephemeral-tier-2026-06-26 P-007):
      # every operator-host recurring timer must go through managedSetInterval
      # (@papercusp/scheduled-registry) so it is NAMED + visible in schedule:inventory.
      # GATING on a NEW bare setInterval() outside the registry; a shrink-to-empty
      # BASELINE grandfathers the pre-codemod sites (emptied by the P-008 codemod).
      - name: Lint no raw setInterval
        run: npm run lint:no-raw-setinterval

      # sql.json guard (EI-607): postgres-js sql.json(object) THROWS on the getOrgPg
      # client (a dual-package postgres-js module-instance mismatch in @papercusp/db)
      # — it silently broke the experiment ledger + EVERY replay-harness cell's
      # persistence, and integration tests are BLIND to it (tolerant root-postgres
      # client). GATING — bind jsonb as ${JSON.stringify(x)}::jsonb (server-side
      # cast → real jsonb object) instead. ALLOW-lists deliberate fresh-pool sites.
      - name: Lint no sql.json on getOrgPg client
        run: npm run lint:no-sql-json

      # SQL-comment backtick guard (EI-7661): a backtick inside a `--` SQL
      # comment silently ENDS the enclosing postgres-js sql`...` tagged
      # template early — the file still compiles (the trailing text can parse
      # as valid TS) and RUNS with the SQL query truncated mid-comment. This
      # amputated the entire WHERE clause from the mig-504 LWW guard's
      # engineer-issues + harness-features upserts on 2026-07-05, applying
      # stale writes unconditionally; only a regressed unit test caught it.
      # GATING — flags a `--` comment line with a raw (unescaped) backtick in
      # any file that uses a sql`...` tagged template.
      - name: Lint no backtick in SQL comment
        run: npm run lint:no-sql-comment-backtick

      # Raw control-byte guard (EI-7432): a NUL byte in tracked TypeScript made
      # ripgrep classify the file as binary and silently skip it, so searches
      # lied about code absence. GATING — scans tracked source files as Buffers
      # and rejects NUL plus C0 controls except tab/newline/carriage return.
      - name: Lint no raw control bytes
        run: npm run lint:no-control-bytes

      # Committed conflict-marker guard (EI-1836): a COMMITTED git conflict bracket
      # (the live-merge resolver does NOT catch one already committed by a bad
      # git-sync auto-merge) broke `vite build` with a cryptic CssSyntaxError, which
      # froze the SPA build, the desktop sidecar, the WI-280 re-key witness, AND the
      # green-checkpoint — the whole fleet deploy, on a stray "Stashed" word in CSS.
      # GATING — flags any line starting with 7 of `<`/`>`/`|` (zero false positives;
      # brackets every git conflict) so it is a loud NAMED failure, not a downstream
      # cryptic build break.
      - name: Lint no committed conflict markers
        run: npm run lint:no-conflict-markers

      # Self-referential export-shim guard (EI-8850): a "forward-compat alias"
      # shim of the shape `export const X = X;` — written after X was already
      # renamed to the target name, colliding with its own export under the
      # SAME identifier — is always either a no-op or a duplicate-export build
      # break. esbuild fails loudly on `bundle-host.sh`, crash-looping the
      # shared staging bg-host (:3170) for the WHOLE fleet, and the failure
      # only surfaces at restart time. GATING — mechanical, zero-false-positive
      # pattern (a genuine rename alias always has two DIFFERENT identifiers).
      - name: Lint no self-referential export shims
        run: npm run lint:no-self-referential-export

      # Smart-quote guard (EI-418, found via EI-412): a curly quote used as a
      # code delimiter (copy-paste through a smart-quoting surface) is a hard
      # esbuild/tsc parse failure that reads as mysterious. GATING — flags
      # U+2018/2019/201C/201D in code position (precise: leaves curly quotes in
      # strings/comments/JSX alone) so the whole file never silently fails to
      # transform.
      - name: Lint smart quotes in code
        run: npm run lint:smart-quotes

      # MDX compile guard (EI-438): a bare `<word>` placeholder in docs prose
      # (e.g. `<date>`, `<id>`) is parsed as an unclosed JSX tag and HARD-fails
      # `astro build`, blocking the whole apps/operator-docs build (every agent's
      # doc regen) — and git-sync auto-commits it before the break is visible.
      # GATING — compiles every tracked .mdx with the MDX core + remark-gfm
      # (matches starlight), so a non-compiling doc never reaches main.
      - name: Lint MDX compiles
        run: npm run lint:mdx

      # Insight-doc citation guard (WI-1576): an agent-insights doc's `documents:`
      # frontmatter citation that no longer resolves on disk (the cited file was
      # renamed/moved/deleted and the doc never updated) silently points an agent
      # at a file that doesn't exist. GATING — checks every tracked .mdx/.md under
      # apps/operator-docs/src/content/docs/agent-insights/ against the same parse
      # the harness-docs anchor/drift system uses (subject-ref.ts), so this lint
      # and that system can never disagree on what a doc cites.
      - name: Lint agent-insights doc citations resolve on disk
        run: npm run lint:insight-citations

      # Rubric method_ref parity guard (EI-8795): rubrics/<id>/METHOD.md and its served
      # apps/operator-docs agent-insights/<id>.mdx twin are hand-synced with no
      # generation link — an author who edits only one leaves docs:search/docs:get (what
      # a grader actually reads) silently stale (WI-3456 landed 21 criteria in METHOD.md
      # while the served mdx stayed at 12, caught a turn later only by hand-diff on
      # WI-3479). GATING — every METHOD.md must have a byte-identical mdx twin
      # (frontmatter aside).
      - name: Lint rubric method_ref (METHOD.md ⇄ agent-insights mdx) parity
        run: npm run lint:rubric-method-ref-parity

      # TSC type-error gate (lint-tsc-gating-EI-60): operator-core has a
      # pre-existing baseline of type errors. This gates NEW errors above the
      # baseline while allowing legacy errors. Baseline is stored in
      # packages/operator-core/.tsc-baseline.json and updated only
      # intentionally (npm run lint:tsc -- --update).
      - name: Lint TSC type errors (gates new errors, allows pre-existing baseline)
        run: npm run lint:tsc

      # Vite externalized-module guard (EI-7275): a `vite build` warning "Module
      # node:* has been externalized for browser compatibility" means a Node-only
      # module reached the SPA's entry graph — the externalized stub THROWS on
      # property ACCESS at module-eval time, blanking the whole app the instant
      # a route evaluates it (shipped for real on 2026-07-04: tooldef's
      # run-script.ts statically imported node:worker_threads). GATING on a NEW
      # warning above the committed baseline count
      # (apps/operator-vite/.externalized-warnings-baseline.json); a shrink-only
      # ratchet, updated only intentionally (npm run lint:vite-externalized -- --update).
      - name: Lint vite build for new externalized-module warnings
        run: npm run lint:vite-externalized

      # Drizzle drift: regenerate generated.ts from the live test PG and
      # fail if it differs from HEAD. Proves `.sql` is the source of
      # truth (PRs that forget to re-run pull-schema fail here).
      # Reuses HARNESS_ADMIN_DATABASE_URL set up by the integration tests.
      - name: Drizzle drift check (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npm run lint:drizzle-drift

      # Zero-config drift: assert zero-config.json's per-table column
      # lists match what drizzle-zero infers from generated.ts. Catches
      # forgotten new columns + stale config entries.
      - name: Zero-config drift check (informational — does not gate)
        if: always()
        continue-on-error: true
        run: node libs/zero-harness/scripts/drizzle-zero-cross-check.mjs


      - name: Knip (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npx knip --no-config-hints --reporter compact

      - name: Publish JUnit reports
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: vitest
          path: '**/junit.xml'
          reporter: java-junit
          fail-on-error: false

  e2e:
    name: E2E (operator)
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --workspace apps/operator playwright install --with-deps chromium

      - name: Build operator (next standalone)
        working-directory: apps/operator
        run: npm run build

      - name: Run E2E
        working-directory: apps/operator
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Publish E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/operator/playwright-report
          if-no-files-found: ignore

      - name: Publish E2E JUnit
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: playwright
          path: apps/operator/junit-e2e.xml
          reporter: java-junit
          fail-on-error: false

  visual:
    name: Visual regression (Lost Pixel)
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per spec §1.11: visual regression is opt-in via PR label, plus
    # auto-applied when story files touch (CODEOWNERS handles the latter
    # by adding the label automatically — wire that separately).
    if: |
      contains(github.event.pull_request.labels.*.name, 'run-visual') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Lost Pixel's pinned Chromium
        run: node node_modules/lost-pixel/node_modules/playwright-core/cli.js install chromium

      - name: Build Storybook (ui-primitives)
        working-directory: libs/generic/ui-primitives
        run: npm run build-storybook

      - name: Lost Pixel comparison (ui-primitives)
        working-directory: libs/generic/ui-primitives
        run: npm run lostpixel

      - name: Build Storybook (marketplace-public-ui)
        working-directory: libs/marketplace-public-ui
        run: npm run build-storybook

      - name: Lost Pixel comparison (marketplace-public-ui)
        working-directory: libs/marketplace-public-ui
        run: npm run lostpixel

      - name: Build Storybook (agent-chat)
        working-directory: libs/agent-chat
        run: npm run build-storybook

      - name: Lost Pixel comparison (agent-chat)
        working-directory: libs/agent-chat
        run: npm run lostpixel

      - name: Build Storybook (operator)
        working-directory: apps/operator
        run: npm run build-storybook

      - name: Lost Pixel comparison (operator)
        working-directory: apps/operator
        run: npm run lostpixel

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-pixel-diffs
          path: |
            libs/generic/ui-primitives/lostpixel-current
            libs/generic/ui-primitives/lostpixel-diff
            libs/marketplace-public-ui/lostpixel-current
            libs/marketplace-public-ui/lostpixel-diff
            libs/agent-chat/lostpixel-current
            libs/agent-chat/lostpixel-diff
            apps/operator/lostpixel-current
            apps/operator/lostpixel-diff
          if-no-files-found: ignore
