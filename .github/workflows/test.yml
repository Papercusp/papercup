name: Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Doctor (Docker + node)
        run: node scripts/test-doctor.mjs

      - name: Cache testcontainers Docker layer
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: testcontainers-${{ runner.os }}-postgres-16-alpine

      - name: Run affected unit + integration suites
        env:
          AFFECTED_BASE: origin/${{ github.base_ref || 'main' }}
          CI: 'true'
        run: node scripts/affected-tests.mjs --integration

      - name: Knip (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npx knip --no-config-hints --reporter compact

      - name: Publish JUnit reports
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: vitest
          path: '**/junit.xml'
          reporter: java-junit
          fail-on-error: false

  e2e:
    name: E2E (operator)
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --workspace apps/operator playwright install --with-deps chromium

      - name: Build operator (next standalone)
        working-directory: apps/operator
        run: npm run build

      - name: Run E2E
        working-directory: apps/operator
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Publish E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/operator/playwright-report
          if-no-files-found: ignore

      - name: Publish E2E JUnit
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: playwright
          path: apps/operator/junit-e2e.xml
          reporter: java-junit
          fail-on-error: false
