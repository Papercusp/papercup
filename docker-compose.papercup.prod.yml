# ⛔ RETIRED 2026-05-30 — @papercup/web (the papercupai.com public site) is retired.
# Preserved for reference, NOT deployed. The app code now lives at _retired/papercup/.
# Restore via _retired/papercup/RESTORE.md (git tag: papercup-web-retired-2026-05-30).
#
# papercupai.com — production deployment on Hetzner via Coolify.
#
# Three services:
#   - papercup    → Next.js public site, Traefik Host=papercupai.com
#   - operator    → harness backend (apps/operator), internal-only
#   - zero-cache  → Rocicorp Zero, exposed at zero-papercup.papercupai.com
#                   for browser-side live queries from the papercup site
#
# All three share the existing `restart-postgres` and the `coolify` Traefik
# network on the same Hetzner host. Database `papercusp` (formerly
# `restart_harness`) and schema `papercup_shared` must exist before first
# boot — see deploy/papercusp-db-init.sql.
#
# Coolify env vars required:
#   PAPERCUP_DOMAIN              papercupai.com
#   POSTGRES_PASSWORD            (same value as Restart's; we share the PG)
#   PAPERCUP_DATABASE_URL        postgres://postgres_app:${POSTGRES_PASSWORD}@restart-postgres:5432/papercusp
#   PAPERCUP_SHARED_DATABASE_URL postgres://postgres_app:${POSTGRES_PASSWORD}@restart-postgres:5432/restart?options=-c%20search_path=papercup_shared,public
#   HARNESS_DATABASE_URL         (same as PAPERCUP_DATABASE_URL — read by libs/db/connection.ts)
#   HARNESS_ADMIN_DATABASE_URL   postgres://postgres_admin:${POSTGRES_PASSWORD}@restart-postgres:5432/papercusp
#   ZERO_ADMIN_PASSWORD          (any non-empty string; gates Zero admin endpoints)
#   GH_DEPLOY_TOKEN              (build-time only; PAT with read access to papercupai/* submodule repos)

services:
  papercup:
    image: papercup:latest
    restart: unless-stopped
    depends_on:
      - operator
    environment:
      NODE_ENV: production
      PORT: "3061"
      HOSTNAME: 0.0.0.0
      # Internal upstreams (resolved on the docker network)
      PAPERCUP_PAPERCUSP_UPSTREAM: http://operator:3055
      PAPERCUP_WEB_UPSTREAM: http://restart-web-1:3001
      # Public-papercup endpoints (/healthz, /harnesses, /harness/:slug, _admin/*)
      # use this base for self-rewrites; default 'http://localhost:3001/api' is
      # the old Restart web app, which doesn't exist in this container.
      # 127.0.0.1 (not localhost) — the container's `localhost` resolves to
      # ::1 first and Next binds IPv4-only on 0.0.0.0.
      INTERNAL_API_BASE: http://127.0.0.1:3061/api
      # Zero — server-injected as window.__HARNESS_ZERO_SERVER by app/layout.tsx
      # so the browser connects to the public Zero subdomain. Runtime-only;
      # changing this value does not require a rebuild.
      HARNESS_ZERO_SERVER: https://zero-papercup.${PAPERCUP_DOMAIN}
      HARNESS_ZERO_INTERNAL_SERVER: ${HARNESS_ZERO_INTERNAL_SERVER:-http://papercup-zero-cache:4848}
      # Database
      DATABASE_URL: ${PAPERCUP_DATABASE_URL}
      PAPERCUP_SHARED_DATABASE_URL: ${PAPERCUP_SHARED_DATABASE_URL}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Public site: papercupai.com (+ www.→apex redirect)
      - "traefik.http.routers.papercup.rule=Host(`${PAPERCUP_DOMAIN}`) || Host(`www.${PAPERCUP_DOMAIN}`)"
      - "traefik.http.routers.papercup.entrypoints=https"
      - "traefik.http.routers.papercup.tls=true"
      - "traefik.http.routers.papercup.tls.certresolver=letsencrypt"
      - "traefik.http.services.papercup.loadbalancer.server.port=3061"
      - "traefik.http.middlewares.papercup-www-redirect.redirectregex.regex=^https?://www\\.${PAPERCUP_DOMAIN}/(.*)"
      - "traefik.http.middlewares.papercup-www-redirect.redirectregex.replacement=https://${PAPERCUP_DOMAIN}/$${1}"
      - "traefik.http.middlewares.papercup-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.papercup.middlewares=papercup-www-redirect,compress"
      # Public API: api.papercupai.com — same backend (the /api/public/papercup/*
      # routes live in apps/papercup itself), but limited to that path prefix
      # and CORS-permissive for the papercupai.com origin.
      - "traefik.http.routers.papercup-api.rule=Host(`api.${PAPERCUP_DOMAIN}`) && PathPrefix(`/api/public/papercup`)"
      - "traefik.http.routers.papercup-api.entrypoints=https"
      - "traefik.http.routers.papercup-api.tls=true"
      - "traefik.http.routers.papercup-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.papercup-api.service=papercup"
      - "traefik.http.middlewares.papercup-api-ratelimit.ratelimit.average=600"
      - "traefik.http.middlewares.papercup-api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.papercup-api-ratelimit.ratelimit.burst=120"
      - "traefik.http.middlewares.papercup-api-cors.headers.accessControlAllowOriginList=https://${PAPERCUP_DOMAIN},https://www.${PAPERCUP_DOMAIN}"
      - "traefik.http.middlewares.papercup-api-cors.headers.accessControlAllowMethods=GET,HEAD,OPTIONS"
      - "traefik.http.middlewares.papercup-api-cors.headers.accessControlMaxAge=600"
      - "traefik.http.routers.papercup-api.middlewares=papercup-api-ratelimit,papercup-api-cors,compress"

  operator:
    image: operator:latest
    restart: unless-stopped
    volumes:
      # Harness working trees — bind from host so state survives container restarts.
      - /opt/papercup-data/projects:/papercusp-projects
      - /opt/papercup-data/config/restart-harness-projects.json:/root/.restart-harness-projects.json:ro
      # claude CLI auth — OAuth credentials portable from the local laptop.
      # File staged at /opt/papercup-data/claude-credentials.json on the host
      # (mode 0600). Mounted read-only into the container's $HOME/.claude.
      # Used by both AGENT_BACKEND=claude-code (direct) and AGENT_BACKEND=omp
      # (Meridian reads the same file via the Claude Code SDK).
      - /opt/papercup-data/claude-credentials.json:/root/.claude/.credentials.json:ro
      # Meridian profiles + SDK state — survives container restarts so
      # multi-profile sessions persist.
      - /opt/papercup-data/meridian-config:/root/.config/meridian
      # gh CLI auth — token-based, stored at /opt/papercup-data/gh-token.
      - /opt/papercup-data/gh-token:/root/.config/gh/hosts.yml:ro
    environment:
      NODE_ENV: production
      PORT: "3055"
      HOSTNAME: 0.0.0.0
      PAPERCUSP_PAPERCUP_UPSTREAM: http://papercup:3061
      PAPERCUSP_WEB_UPSTREAM: http://restart-web-1:3001
      DATABASE_URL: ${PAPERCUP_DATABASE_URL}
      PAPERCUP_SHARED_DATABASE_URL: ${PAPERCUP_SHARED_DATABASE_URL}
      HARNESS_DATABASE_URL: ${HARNESS_DATABASE_URL}
      HARNESS_ADMIN_DATABASE_URL: ${HARNESS_ADMIN_DATABASE_URL}
      # Harness runtime — set so apps/operator/app/api/_hono/harness-paths.ts
      # finds run.sh + prompts inside the image (not ~/autonomous-harness).
      PAPERCUSP_HARNESS_DIR: /opt/harness
      # AGENT_BACKEND defaults to omp (Meridian + Claude Max OAuth via
      # mounted credentials.json). Override to 'claude-code' or 'auto' to
      # change. Most users should leave unset.
      AGENT_BACKEND: ${AGENT_BACKEND:-omp}
      # Meridian runs in-container alongside the operator (Dockerfile CMD).
      # Override only if you're running meridian as a sibling service.
      MERIDIAN_BASE_URL: ${MERIDIAN_BASE_URL:-http://127.0.0.1:3456}
      # ANTHROPIC_API_KEY is fully optional with the omp default — Meridian
      # uses Claude Max OAuth via the mounted credentials.json. Only needed
      # if you set AGENT_BACKEND=claude-code AND don't have OAuth set up.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - coolify
      - restart_internal
    # Not exposed via Traefik — internal harness backend only.

  zero-cache:
    image: rocicorp/zero:latest # placeholder; substituted with restart-zero-cache:latest in deploy
    container_name: papercup-zero-cache
    restart: unless-stopped
    depends_on:
      - papercup
    environment:
      NODE_ENV: production
      ZERO_APP_ID: papercup
      ZERO_UPSTREAM_DB: ${PAPERCUP_DATABASE_URL}
      ZERO_CHANGE_DB: ${PAPERCUP_DATABASE_URL}
      ZERO_REPLICA_FILE: /data/zero/replica.db
      ZERO_APP_PUBLICATIONS: zero_harness
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD}
      # Named-query resolver — every useQuery(queries.X.Y(...)) call routes
      # here so zero-cache can re-transform it into ZQL against the replica.
      # Without this, named-query subscriptions return 0 rows and the
      # zero-cache log spits "no ZERO_QUERY_URL is configured" warnings.
      # papercup hosts the resolver at /api/zero-harness-query.
      ZERO_QUERY_URL: http://papercup:3061/api/zero-harness-query
    volumes:
      - papercup-zero-data:/data/zero
    networks:
      - coolify
      - restart_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4848/keepalive || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.papercup-zero.rule=Host(`zero-papercup.${PAPERCUP_DOMAIN}`)"
      - "traefik.http.routers.papercup-zero.entrypoints=https"
      - "traefik.http.routers.papercup-zero.tls=true"
      - "traefik.http.routers.papercup-zero.tls.certresolver=letsencrypt"
      # ALPN-restrict to http/1.1 — browsers don't support WS-over-HTTP/2
      # (Extended CONNECT, RFC 8441) reliably; Traefik 503s on those upgrades.
      # Requires the matching TLS option file in deploy/papercup-zero-tls.yaml,
      # placed at /data/coolify/proxy/dynamic/papercup-zero-tls.yaml on the host.
      - "traefik.http.routers.papercup-zero.tls.options=papercup-zero@file"
      - "traefik.http.services.papercup-zero.loadbalancer.server.port=4848"
      # CORS for the papercup browser to connect from the apex domain.
      - "traefik.http.middlewares.papercup-zero-cors.headers.accessControlAllowOriginList=https://${PAPERCUP_DOMAIN},https://www.${PAPERCUP_DOMAIN}"
      - "traefik.http.middlewares.papercup-zero-cors.headers.accessControlAllowMethods=GET,POST,OPTIONS"
      - "traefik.http.routers.papercup-zero.middlewares=papercup-zero-cors"

volumes:
  papercup-zero-data:

networks:
  coolify:
    external: true
  restart_internal:
    external: true
