# P-007 (infra-perf-reliability-audit-round4) — protect the DBOS routines/git-sync/substrate primary loop from
# runaway-proc starvation under host contention. CPUWeight only bites when cores are
# saturated; no effect on idle headroom. Reversible: rm this file + `systemctl --user
# daemon-reload`. Applies live on daemon-reload (NO restart needed for CPUWeight).
[Service]
CPUWeight=10000
StartupCPUWeight=10000
